<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 226" role="img" aria-label="S4NDMoD26">
  <title>S4NDMoD26</title>
  <defs>
    <!-- Grid: wing bars are 12 thick, numeral strokes 15; x=248 is the outer edge of the body, of the shoulder
         block and the end of the lower bar (x=152 on the left); the block's bottom is the second bar's
         bottom; the lower bar's top is the numerals' top; every bar tip is cut at 45 degrees and all the
         tips lie on one straight line (x = 394 - (y-54)); the top bar's cut-back and the slot's closing end
         are parallel. -->
    <!-- right wing; the left is this mirrored -->
    <g id="s4-wing">
      <!-- shoulder block (narrow), beak hooked toward the centre -->
      <path d="M248 16 L228 19 Q212 21 206 32 L206 38 Q216 35 220 48 L220 90 L248 90 Z"/>
      <!-- feather unit: top bar cut back on a diagonal against the block, joined to the second bar where
           the slot between them closes -->
      <path d="M262 54 L394 54 L382 66 L294 66 L303 78 L370 78 L358 90 L248 90 L248 78 L280 78 Z"/>
      <!-- lower bar: runs on into the top bar of the numeral -->
      <path d="M248 100 L348 100 L336 112 L248 112 Z"/>
    </g>
    <g id="s4-eagle">
      <use href="#s4-wing"/>
      <use href="#s4-wing" transform="translate(400 0) scale(-1 1)"/>
      <path d="M152 100 L196 100 L196 161 L167 161 L167 188.6 L196 199.5 L196 214.5 L152 198 L152 146 L181 146 L181 115 L152 115 Z"/>
      <path fill-rule="evenodd" d="M204 100 L248 100 L248 115 L219 115 L219 146 L248 146 L248 198 L204 214.5 Z M219 161 L233 161 L233 188.6 L219 193.9 Z"/>
    </g>
    <!-- solid backing: the wing silhouettes (gaps between the bars filled) and the body outline (counters
         filled), so the white is continuous behind the whole eagle as on the key art -->
    <g id="s4-back">
      <path d="M248 54 L394 54 L336 112 L248 112 Z"/>
      <path d="M152 54 L6 54 L64 112 L152 112 Z"/>
      <path d="M152 100 L248 100 L248 198 L200 216 L152 198 Z"/>
      <path d="M152 88 H248 V102 H152 Z"/>   <!-- joins the heads' backing to the body's -->
      <path d="M248 16 L228 19 Q212 21 206 32 L206 38 Q216 35 220 48 L220 90 L248 90 Z"/>
      <path d="M152 16 L172 19 Q188 21 194 32 L194 38 Q184 35 180 48 L180 90 L152 90 Z"/>
    </g>
  </defs>
  <use href="#s4-back" fill="#f1f5f1" stroke="#f1f5f1" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="3"/>
  <!-- the red; a hairline red stroke closes seams where shapes abut -->
  <use href="#s4-eagle" fill="#cf1b1f" stroke="#cf1b1f" stroke-width="1" stroke-linejoin="miter" stroke-miterlimit="3"/>
</svg>

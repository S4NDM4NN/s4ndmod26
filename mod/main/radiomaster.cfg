// RadioMaster (or similar RC transmitter used as a USB joystick) overrides.
// exec this AFTER controller.cfg, e.g. in autoexec.cfg:
//   exec controller.cfg
//   exec radiomaster.cfg
//
// This radio's throttle lands on SDL's LEFTTRIGGER axis rather than a
// stick Y axis (tested against a RadioMaster TX15, VID 1209 / PID 4f54,
// which has a built-in mapping in SDL's community controller DB). The
// engine only routes a gamepad axis into cl.joystickAxis[] if the
// digital key tied to that axis is bound to a "+"-command its
// digital->analog translator recognizes (KeyToAxisAndSign in
// code/sdl/sdl_input.c) - PAD0_LEFTTRIGGER defaults to "+speed", which
// isn't recognized, so throttle data never reaches the game at all
// regardless of j_forward_axis's value until this is rebound.
seta j_forward_axis "4"
bind PAD0_LEFTTRIGGER "+forward"

// j_side_axis(0)/j_yaw_axis(2)/j_pitch_axis(3) already match this radio's
// left-stick-X (yaw) / right-stick-X (roll) / right-stick-Y (pitch), so
// no other axis cvars need to change from controller.cfg's defaults.

// PAD0_RIGHTTRIGGER stays bound to "+attack" from controller.cfg - this
// radio's SDL mapping puts its own RIGHTTRIGGER axis on a channel that
// tested as unused/dead, so it's not needed for /dronesim.

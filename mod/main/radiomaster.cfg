// RadioMaster (or similar RC transmitter used as a USB joystick) overrides
// for /dronesim. exec this AFTER controller.cfg, e.g. in autoexec.cfg:
//   exec controller.cfg
//   exec radiomaster.cfg
//
// Prefer running /dronecal in-game instead of trusting these values as-is -
// it auto-detects the correct axis (or, for a throttle exposed as an
// analog gamepad BUTTON - see below - the correct button slot) for each
// control by watching raw per-device input directly, which is the most
// reliable way to calibrate any unusual controller. These are just a
// known-good starting point from one RadioMaster TX15 (VID 1209 / PID
// 4f54) on the WASM/browser client, in Chrome, confirmed 2026-08-25.
//
// Drone-sim flight control (CL_DroneJoystickMove) and /dronecal's readout
// both read raw device input directly - a plain per-device axis or button
// index (see IN_GetRawGamepadAxis / IN_GetGamepadAnalogButton in
// code/sdl/sdl_input.c) - NOT an SDL_GameController slot. That's
// deliberate: this radio's SDL_GameController-mapped RIGHTX/RIGHTY slots
// collide with a hardcoded menu-cursor driver elsewhere in the engine
// (moving a flight control would also drag a cursor around any open
// menu), and its TRIGGERLEFT/TRIGGERRIGHT slots can't carry real analog
// resolution through Emscripten's SDL2 port regardless (see
// IN_GetGamepadAnalogButton's comment for why). Reading raw device input
// sidesteps both.
// Firefox/Windows: raw HID axis order (no standard-mapping reshuffle like
// Chrome). Observed there: throttle lever on axis 0, yaw on axis 1; roll and
// pitch assumed axes 2/3 - swap j_drone_roll_axis/j_drone_pitch_axis if they come out
// reversed, or flip a j_drone_* sign if a direction is backwards.
// Radios are detected automatically (j_drone_device, by name and the
// 1209:4f54 EdgeTX/OpenTX VID:PID) and used ONLY for drone flight, so a normal
// gamepad (in_joystickNo, skipping the radio) keeps driving menus/look/move.
// If your radio isn't picked up, set j_drone_device to part of its name.
// j_drone_only 1 is for a radio that is your ONLY device but isn't detected:
// it makes whatever in_joystickNo selects drone-only.
seta j_drone_only "0"

seta j_drone_throttle_axis "0"
seta j_drone_throttle_isbutton "0"
seta j_drone_yaw_axis      "1"
seta j_drone_roll_axis     "2"
seta j_drone_pitch_axis    "3"

// throttle: 0..32767 lever * 0.0039 = upmove 0..127. Negative inverts lever.
seta j_drone_throttle "0.0039"
seta j_drone_yaw      "-0.011"
seta j_drone_roll     "0.018"
seta j_drone_pitch    "0.018"

// Rates in deg/sec at full stick = |value| * 32767 (yaw 360, roll/pitch ~590);
// j_drone_expo (0..1) softens the stick center, j_drone_deadzone trims drift.

// --- Chrome (standard-mapping) values, kept for reference ---
// j_drone_yaw_axis 3, j_drone_throttle_axis 6 + isbutton 1, j_drone_roll_axis 0, j_drone_pitch_axis 1,
// j_drone_throttle -0.0039, j_drone_pitch -0.022

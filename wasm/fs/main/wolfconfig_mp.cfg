//
// WASM Game Default Configuration
//
// Filename matters: this must be named wolfconfig_mp.cfg (Q3CONFIG_CFG for
// a non-DEDICATED build - see qcommon.h) so Com_ExecuteCfg() picks it up
// automatically for a brand-new profile. It previously sat here as
// "wolfconfig.cfg" (the old single-player name) and was silently never
// loaded - in_joystick/wasmjoy.cfg's binds looked "enabled" in a Settings
// toggle but nothing ever actually worked until you manually exec'd
// controller.cfg. Once a profile's own wolfconfig_mp.cfg gets written to
// the writable homepath (any Settings Apply/Cancel triggers this), that
// copy is found ahead of this preloaded one on every later boot, so this
// only ever seeds first-time defaults - it never clobbers anything the
// player customizes afterward (bind changes included).

// Set in-game detail
seta cg_marktime "20000"
seta cg_particleDist "1024"
seta cg_coronafardist "1536"
seta cg_coronas "1"

// Enable joystick - controller.cfg (mod/main/controller.cfg, bundled into
// s4ndmod26.pk3) sets these too plus the full button/stick bind set, aim
// assist tuning, and controller curve/lean-mod cvars - it's the real
// default, not wasmjoy.cfg's plainer bind-only set.
seta in_joystick "1"
seta in_joystickuseanalog "1"

// Widescreen video, not overridden by recommended defaults option
seta cg_fixedAspect "1"
seta r_customwidth "640"
seta r_customheight "480"
seta r_mode "3"

// Cosmetic only
seta s_khz "22"

// Load the S4NDMoD26 game content
seta fs_game "s4ndmod26"

echo "WASM game defaults loaded!"

// Execute the real default controller mapping (binds, aim assist, curve/
// lean-mod tuning) before the game starts - lives in the mod's own pak
// (s4ndmod26/controller.cfg), found via the normal fs_game search-path
// overlay set above, same as if you'd typed it at the console.
exec "controller.cfg"

// Execute recommended WASM video settings before the game starts and flag it
// as loaded so the video subsystem does not get restarted later
exec "wasmvid.cfg"
seta com_recommendedSet "1"

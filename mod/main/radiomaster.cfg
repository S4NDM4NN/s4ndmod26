// RadioMaster (or similar RC transmitter used as a USB joystick) overrides
// for /dronesim. exec this AFTER controller.cfg, e.g. in autoexec.cfg:
//   exec controller.cfg
//   exec radiomaster.cfg
//
// Prefer running /dronecal in-game instead of trusting these values as-is -
// it auto-detects the correct axis (or, for a throttle exposed as an
// analog gamepad BUTTON - see below - the correct button slot) for each
// control by watching raw per-device input directly, which is the most
// reliable way to calibrate any unusual controller. These are just a
// known-good starting point from one RadioMaster TX15 (VID 1209 / PID
// 4f54) on the WASM/browser client, in Chrome, confirmed 2026-08-25.
//
// Drone-sim flight control (CL_DroneJoystickMove) and /dronecal's readout
// both read raw device input directly - a plain per-device axis or button
// index (see IN_GetRawGamepadAxis / IN_GetGamepadAnalogButton in
// code/sdl/sdl_input.c) - NOT an SDL_GameController slot. That's
// deliberate: this radio's SDL_GameController-mapped RIGHTX/RIGHTY slots
// collide with a hardcoded menu-cursor driver elsewhere in the engine
// (moving a flight control would also drag a cursor around any open
// menu), and its TRIGGERLEFT/TRIGGERRIGHT slots can't carry real analog
// resolution through Emscripten's SDL2 port regardless (see
// IN_GetGamepadAnalogButton's comment for why). Reading raw device input
// sidesteps both.
seta j_side_axis    "3"
seta j_forward_axis "6"
seta j_yaw_axis     "0"
seta j_pitch_axis   "1"

// Confirmed via navigator.getGamepads() directly (bypassing SDL) in
// Chrome: this radio's throttle lever is non-self-centering, so the
// browser's standard-gamepad-mapping heuristic buckets it into
// buttons[6] (the W3C "left trigger" slot) as an analog 0..1 BUTTON
// value instead of putting it in axes[] at all. j_forward_axis above is
// therefore a BUTTON slot, not an axis slot, for this radio - this flag
// tells CL_DroneJoystickMove and /dronecal to read it that way.
seta j_forward_axis_isbutton "1"

// Confirmed inverted from the naive "positive = climb" guess on this
// radio - pushing the lever up actually reads toward the button's LOW
// end, not its high end, so this needs a negative sign to climb on push.
seta j_drone_throttle "-0.25"

// This radio's throttle button also only exercises part of its 0..1
// analog range in this browser (some browsers' standard-gamepad-mapping
// trigger synthesis only maps part of a raw HID axis's native range),
// which without a rescale looks like "dead" travel with 0 sitting at
// throttle mid-stick instead of the true bottom. Prefer running
// /dronecal over trusting these two placeholder values - it measures
// your actual observed min/max directly and sets these for you.
seta j_forward_axis_button_min "0"
seta j_forward_axis_button_max "1"

// Confirmed inverted on this radio too - right stick Y (pitch) needs a
// negative sign here, unlike normal look-pitch's positive j_pitch.
seta j_drone_pitch "-0.022"

// RadioMaster (or similar RC transmitter used as a USB joystick) overrides
// for /dronesim. exec this AFTER controller.cfg, e.g. in autoexec.cfg:
//   exec controller.cfg
//   exec radiomaster.cfg
//
// Prefer running /dronecal in-game instead of trusting these values as-is -
// it auto-detects the correct axis for each control by watching raw
// per-device axis movement directly, which is the most reliable way to
// calibrate any unusual controller. These are just a known-good starting
// point from one RadioMaster TX15 (VID 1209 / PID 4f54) on the WASM/
// browser client.
//
// Drone-sim flight control (CL_DroneJoystickMove) and /dronecal's readout
// both read the raw SDL_Joystick axis directly (IN_GetRawGamepadAxis in
// code/sdl/sdl_input.c) - a plain per-device axis index (0..7 on this
// radio's 8 axes), NOT an SDL_GameController slot. That's deliberate:
// this radio's SDL_GameController-mapped RIGHTX/RIGHTY slots collide with
// a hardcoded menu-cursor driver elsewhere in the engine (moving a flight
// control would also drag a cursor around any open menu), and its
// TRIGGERLEFT/TRIGGERRIGHT slots read back completely flat in this
// browser/SDL2 combination. Reading the raw axis sidesteps both.
seta j_side_axis    "3"
seta j_forward_axis "2"
seta j_yaw_axis     "0"
seta j_pitch_axis   "1"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 226" role="img" aria-label="S4NDMoD26">
  <title>S4NDMoD26</title>
  <defs>
    <!-- right wing; the left is this mirrored -->
    <g id="s4-wing">
      <!-- shoulder block, beak hooked toward the centre -->
      <path d="M268 16 L240 20 Q222 22 214 33 L214 39 Q224 35 228 48 L228 94 L268 94 Z"/>
      <!-- feather unit: top bar cut back on a diagonal against the shoulder, joined to the second bar
           where the slot between them closes (as on the original) -->
      <path d="M284 54 L394 54 L377 68 L314 68 L314 80 L374 80 L356 94 L268 94 L268 80 L304 80 Z"/>
      <!-- lower bar: runs on into the top bar of the numeral -->
      <path d="M248 104 L352 104 L336 119 L248 119 Z"/>
    </g>
    <g id="s4-eagle">
      <use href="#s4-wing"/>
      <use href="#s4-wing" transform="translate(400 0) scale(-1 1)"/>
      <!-- "26": stencil slabs, bottoms sloping to a V at the centre -->
      <path d="M152 104 H196 V119 H152 Z"/>
      <path d="M181 119 H196 V149 H181 Z"/>
      <path d="M152 149 H196 V164 H152 Z"/>
      <path d="M152 164 H167 V200 H152 Z"/>
      <path d="M152 185 L196 202 V216 L152 200 Z"/>
      <path d="M204 104 H248 V119 H204 Z"/>
      <path d="M204 119 H219 V216 H204 Z"/>
      <path d="M204 149 H248 V164 H204 Z"/>
      <path d="M233 164 H248 V200 H233 Z"/>
      <path d="M204 202 L248 185 V200 L204 216 Z"/>
    </g>
  </defs>
  <!-- white backing, then the red; a hairline red stroke closes seams where shapes abut -->
  <use href="#s4-eagle" fill="#f1f5f1" stroke="#f1f5f1" stroke-width="7" stroke-linejoin="miter" stroke-miterlimit="3"/>
  <use href="#s4-eagle" fill="#cf1b1f" stroke="#cf1b1f" stroke-width="1" stroke-linejoin="miter" stroke-miterlimit="3"/>
</svg>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games — S4NDMoD26</title>
<link rel="stylesheet" href="/s4nd.css">
<style>

  #loading { color: var(--faint); padding: 1rem 0; }
  #error   { color: var(--bad); padding: 1rem 0; }

  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  thead th {
    text-align: left; color: var(--dim); font-size: 0.75rem; letter-spacing: 0.06em;
    text-transform: uppercase; border-bottom: 1px solid var(--panel-lo);
    padding: 0.4rem 0.6rem; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--gold); }
  thead th.sorted::after { content: ' ↓'; }
  thead th.sorted.asc::after { content: ' ↑'; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: rgba(0,0,0,.25); }
  td { padding: 0.35rem 0.6rem; border-bottom: 1px solid rgba(0,0,0,.35); font-size: 0.85rem; }
  td.map-col { color: var(--text); font-weight: 600; }
  td.mono { font-family: monospace; }

  .badge {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; vertical-align: middle;
  }
  .badge-potg { background: #3a2000; color: var(--gold); border: 1px solid #6a3800; }
  .badge-potg { max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.badge-play { cursor: pointer; font-family: inherit; }
  button.badge-play:hover { background: #5a3000; border-color: var(--gold); }
  .badge-stats { background: #10241a; color: var(--ok); border: 1px solid #1f4a30; margin-left: 0.4rem; }
  .badge-stats:hover { background: #17361f; border-color: var(--ok); text-decoration: none; }
  .badge-ax   { background: #2a0a0a; color: #f66; border: 1px solid #5a1a1a; font-size: 0.65rem; }
  .badge-al   { background: #0a1a2a; color: #6af; border: 1px solid #1a3a5a; font-size: 0.65rem; }

  .empty { color: #444; padding: 2rem 0; }

  .filters { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .filters input[type=text] {
    background: rgba(0,0,0,.25); border: 1px solid var(--panel-lo); color: var(--text);
    padding: 0.3rem 0.6rem; border-radius: 3px; font-family: monospace; font-size: 0.85rem;
    outline: none; width: 180px;
  }
  .filters input[type=text]:focus { border-color: var(--faint); }
  .filters select {
    background: rgba(0,0,0,.25); border: 1px solid var(--panel-lo); color: var(--text);
    padding: 0.3rem 0.6rem; border-radius: 3px; font-family: monospace; font-size: 0.85rem;
    outline: none;
  }
  .count { color: var(--faint); font-size: 0.8rem; }
  .sort-mobile { display: none; }

  /* Phones: the 7-column table is wider than the screen (the Kills column and the play button fell
     off the right edge), so each game becomes a card instead. */
  @media (max-width: 640px) {



    .filters { gap: 0.6rem; }
    .filters input[type=text] { flex: 1 1 100%; width: 100%; }
    .filters select { flex: 1 1 40%; }
    .filters input[type=text], .filters select { font-size: 16px; min-height: 44px; }  /* 16px: no iOS zoom */
    .sort-mobile { display: block; }
    .count { flex: 1 1 100%; }

    table, tbody { display: block; }
    thead { display: none; }
    tbody tr {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.7rem;
      padding: 0.75rem; margin-bottom: 0.6rem;
      background: #161616; border: 1px solid #242424; border-radius: 6px;
    }
    tbody tr:hover td { background: transparent; }
    td { display: block; padding: 0; border: 0; font-size: 0.9rem; }
    td:nth-child(2) { order: 1; flex: 1 1 auto; font-size: 1.1rem; }              /* map */
    td:nth-child(4) { order: 2; color: var(--text); }                                    /* duration */
    td:nth-child(1) { order: 3; flex-basis: 100%; color: #777; font-size: 0.8rem; } /* date */
    td:nth-child(3) { order: 4; }                                                 /* gametype */
    td:nth-child(5) { order: 5; color: var(--dim); }
    td:nth-child(5)::after { content: ' players'; }
    td:nth-child(6) { order: 6; color: var(--dim); }
    td:nth-child(6)::after { content: ' kills'; }
    td:nth-child(7) { order: 7; flex-basis: 100%; margin-top: 0.45rem; }          /* POTG */
    td:nth-child(7):empty { display: none; }

    .badge-potg { max-width: 100%; font-size: 0.85rem; padding: 0.5rem 0.75rem; }
    button.badge-play { display: block; width: 100%; min-height: 44px; text-align: left; }
  }
</style>

<h2>Games</h2>

<div class="filters">
  <input type="text" id="search" placeholder="Filter map…" oninput="applyFilters()">
  <select id="gt-filter" onchange="applyFilters()">
    <option value="">All gametypes</option>
  </select>
  <select id="sort-select" class="sort-mobile" aria-label="Sort games" onchange="sortFromSelect()">
    <option value="date:desc">Newest first</option>
    <option value="date:asc">Oldest first</option>
    <option value="duration:desc">Longest</option>
    <option value="duration:asc">Shortest</option>
    <option value="kills:desc">Most kills</option>
    <option value="players:desc">Most players</option>
    <option value="map:asc">Map A–Z</option>
  </select>
  <span id="count" class="count"></span>
</div>

<div id="loading">Loading…</div>
<div id="error" style="display:none"></div>
<div id="table-wrap" style="display:none">
  <table>
    <thead>
      <tr>
        <th data-col="date"     onclick="sortBy('date')">Date</th>
        <th data-col="map"      onclick="sortBy('map')">Map</th>
        <th data-col="gametype" onclick="sortBy('gametype')">Gametype</th>
        <th data-col="duration" onclick="sortBy('duration')">Duration</th>
        <th data-col="players"  onclick="sortBy('players')">Players</th>
        <th data-col="kills"    onclick="sortBy('kills')">Kills</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <p class="empty" id="empty-msg" style="display:none">No games match your filter.</p>
</div>

<script>
'use strict';

let allGames = [];
let sortCol = 'date';
let sortAsc = false;
let filterMap = '';
let filterGT = '';

function fmtDuration(ms) {
  if (!ms) return '—';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

function fmtDate(iso) {
  if (!iso) return '—';
  // ISO format: 2026-06-06T02:25:49Z — parse as UTC
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) +
    ' ' + d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', hour12: false});
}

// "<player> POTG": whose play it is, so the right one is easy to find in the list.
function potgLabel(g) {
  return (g.potg_player ? esc(g.potg_player) + ' ' : '') + 'POTG';
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sortBy(col) {
  if (sortCol === col) { sortAsc = !sortAsc; }
  else { sortCol = col; sortAsc = col === 'map' || col === 'gametype'; }
  renderTable();
  updateSortUI();
}

// Mobile hides the column headers, so sorting goes through a dropdown that drives the same state.
function sortFromSelect() {
  const [col, dir] = document.getElementById('sort-select').value.split(':');
  sortCol = col;
  sortAsc = dir === 'asc';
  renderTable();
  updateSortUI();
}

function updateSortUI() {
  const sel = document.getElementById('sort-select');
  const want = sortCol + ':' + (sortAsc ? 'asc' : 'desc');
  sel.value = [...sel.options].some(o => o.value === want) ? want : '';
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.remove('sorted', 'asc');
    if (th.dataset.col === sortCol) {
      th.classList.add('sorted');
      if (sortAsc) th.classList.add('asc');
    }
  });
}

function applyFilters() {
  filterMap = document.getElementById('search').value.trim().toLowerCase();
  filterGT  = document.getElementById('gt-filter').value;
  renderTable();
}

function renderTable() {
  let games = allGames.filter(g => {
    if (filterMap && !g.map.toLowerCase().includes(filterMap)) return false;
    if (filterGT && String(g.gametype) !== filterGT) return false;
    return true;
  });

  games.sort((a, b) => {
    let av, bv;
    switch (sortCol) {
      case 'date':     av = a.generated_at; bv = b.generated_at; break;
      case 'map':      av = a.map;          bv = b.map;          break;
      case 'gametype': av = a.gametype_name;bv = b.gametype_name;break;
      case 'duration': av = a.duration_ms;  bv = b.duration_ms;  break;
      case 'players':  av = a.player_count; bv = b.player_count; break;
      case 'kills':    av = a.kill_count;   bv = b.kill_count;   break;
      default:         av = 0; bv = 0;
    }
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  games.forEach(g => {
    const tr = document.createElement('tr');
    tr.title = g.has_stats ? 'View stats →' : 'View timeline →';
    tr.onclick = (e) => {
      const play = e.target.closest && e.target.closest('.badge-play');
      if (play) { openPotgPlayer(play.dataset.replay); return; }
      if (e.target.closest && e.target.closest('.badge-stats')) return;     // the Stats link navigates by itself
      // the stats are the main page for a game; the timeline is its companion
      window.location.href = (g.has_stats ? '/game.html?r=' : '/timeline.html?mode=replay&r=') + encodeURIComponent(g.name);
    };
    tr.innerHTML =
      '<td class="mono">'  + esc(fmtDate(g.generated_at)) + '</td>' +
      '<td class="map-col">' + esc(g.map) + '</td>' +
      '<td>' + esc(g.gametype_name) + '</td>' +
      '<td class="mono">' + fmtDuration(g.duration_ms) + '</td>' +
      '<td>' + (g.player_count || '—') + '</td>' +
      '<td>' + (g.kill_count   || '0') + '</td>' +
      '<td>' + (g.has_potg
        ? (g.has_rpl
            ? '<button type="button" class="badge badge-potg badge-play" data-replay="' + esc(g.name) +
              '" title="Watch the play of the game' + (g.potg_player ? ' by ' + esc(g.potg_player) : '') + '">&#9654; ' + potgLabel(g) + '</button>'
            : '<span class="badge badge-potg">' + potgLabel(g) + '</span>')
        : '') +
      (g.has_stats ? ' <a class="badge badge-stats" href="/game.html?r=' + encodeURIComponent(g.name) + '" title="Players, weapons, streaks and awards for this game">Stats</a>' : '') +
      '</td>';
    tbody.appendChild(tr);
  });

  const empty = document.getElementById('empty-msg');
  empty.style.display = games.length === 0 ? '' : 'none';

  document.getElementById('count').textContent =
    games.length === allGames.length
      ? allGames.length + ' games'
      : games.length + ' of ' + allGames.length + ' games';
}

function populateGTFilter(games) {
  const types = {};
  games.forEach(g => { types[g.gametype] = g.gametype_name; });
  const sel = document.getElementById('gt-filter');
  Object.keys(types).sort().forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = types[k];
    sel.appendChild(opt);
  });
}

// The server builds the list in the background and answers 503 while it is still warming up (right after a
// restart), and a request can fail on a flaky connection, so try a few times before giving up.
const LOAD_RETRY_MS = [1000, 2000, 4000, 8000, 15000];

function showGames(data) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('table-wrap').style.display = '';
  allGames = data || [];
  populateGTFilter(allGames);
  updateSortUI();
  renderTable();
}

function loadGames(attempt) {
  fetch('/api/replays')
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(showGames)
    .catch(err => {
      if (attempt < LOAD_RETRY_MS.length) {
        const loading = document.getElementById('loading');
        loading.style.display = '';
        loading.textContent = 'Loading games\u2026 (retrying)';
        setTimeout(() => loadGames(attempt + 1), LOAD_RETRY_MS[attempt]);
        return;
      }
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.textContent = 'Failed to load games: ' + err.message;
      el.style.display = '';
    });
}

loadGames(0);

</script>
</div>

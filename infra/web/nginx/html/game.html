<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game stats — S4NDMoD26</title>
<link rel="stylesheet" href="/s4nd.css">
<style>
  #loading { color: var(--faint); padding: 1rem 0; }
  #error   { color: var(--bad); padding: 1rem 0; }
  :root { --axis: #f66; --allies: #6af; --inset: rgba(0,0,0,.24); }
  .crumbs { color: var(--faint); font-size: 0.85rem; margin: 0.2rem 0 0.8rem; }

  /* Layers: the page background, then bevelled panels (the hero and each section), then a darker inset inside a panel for its content,
     then rows, chips and bars on that. */
  .sect { margin-top: 1.1rem; }
  .sect-head { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem 0.9rem; padding: 0.55rem 0.9rem; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.2)); border-bottom: 1px solid var(--panel-lo); }
  .sect-head h3 { margin: 0; font: 400 1.2rem/1.2 var(--display); letter-spacing: 0.07em; text-transform: uppercase; color: var(--text); text-shadow: 1px 1px 0 #000; }
  .sect-head .sub { color: var(--faint); font-size: 0.8rem; }
  .sect-head .right { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  .sect-body { padding: 0.7rem 0.9rem; background: var(--inset); }
  .sect-body.flush { padding: 0; }
  .sect-head.axis   { background: linear-gradient(90deg, rgba(207,27,31,.38), rgba(207,27,31,.06) 70%), linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.2)); }
  .sect-head.allies { background: linear-gradient(90deg, rgba(60,130,230,.38), rgba(60,130,230,.06) 70%), linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.2)); }
  .sect-head.axis h3 { color: #ff9a9a; } .sect-head.allies h3 { color: #9cc7ff; }

  /* the top of the page: map art, name, result and the ways into the game */
  .hero { position: relative; overflow: hidden; padding: 1.1rem 1.3rem 1rem; min-height: 9.5rem;
    background: linear-gradient(90deg, rgba(10,13,11,.97) 0%, rgba(10,13,11,.86) 42%, rgba(10,13,11,.3) 100%), var(--shot, none) right 15% / cover no-repeat, var(--panel); }
  .hero .eyebrow { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
  .hero h2 { margin: 0.05rem 0 0.35rem; font: 400 2.7rem/1.05 var(--display); letter-spacing: 0.04em; text-shadow: 2px 2px 0 #000; word-break: break-word; }
  .hero .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: var(--dim); background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 2px 11px; backdrop-filter: blur(2px); }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.won-axis   { color: #ffb0b0; border-color: rgba(255,102,102,.6); background: rgba(207,27,31,.28); }
  .pill.won-allies { color: #b5d6ff; border-color: rgba(102,170,255,.6); background: rgba(60,130,230,.28); }
  .hero .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .btn { display: inline-block; padding: 5px 14px; font-weight: 600; font-size: 0.88rem; color: var(--text); background: rgba(0,0,0,.4); border: 1px solid var(--edge); border-radius: 3px; text-decoration: none; }
  .btn:hover { border-color: var(--link); color: #fff; text-decoration: none; background: rgba(143,208,255,.12); }
  button.btn { font-family: inherit; cursor: pointer; }
  .btn.primary { background: rgba(207,27,31,.55); border-color: var(--red-lit); }
  .btn.primary:hover { background: rgba(232,57,60,.7); border-color: #fff; }

  /* the result: each team's totals, the winner lit, and the share of kills */
  .scoreline { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; margin-top: 1.1rem; }
  .tile { position: relative; padding: 0.7rem 1rem 0.8rem; background: var(--panel); border: 2px solid; border-color: var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi); outline: 1px solid #000; border-top: 3px solid var(--tc); overflow: hidden; }
  .tile::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--tc) -80%, transparent 55%); opacity: .22; pointer-events: none; }
  .tile.axis { --tc: var(--axis); } .tile.allies { --tc: var(--allies); }
  .tile .tname { position: relative; display: flex; align-items: center; gap: 0.6rem; font: 400 1.25rem/1.1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--tc); }
  .tile .big { position: relative; font: 400 3.1rem/1 var(--display); color: var(--text); text-shadow: 2px 2px 0 #000; }
  .tile .big small { font: 400 0.8rem var(--ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-left: 0.4rem; text-shadow: none; }
  .tile .stats { position: relative; display: flex; flex-wrap: wrap; gap: 0.1rem 1.1rem; color: var(--dim); font-size: 0.82rem; margin-top: 0.3rem; }
  .tile .stats b { color: var(--text); font-weight: 600; }
  .tile.win { box-shadow: 0 0 0 1px var(--gold) inset, 0 0 22px rgba(214,178,90,.18); }
  .winner-badge { font: 700 0.68rem/1.5 var(--ui); letter-spacing: 0.1em; color: #2a1d00; background: var(--gold); border-radius: 3px; padding: 0 7px; }
  .share { grid-column: 1 / -1; display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #000; border: 1px solid #000; }
  .share i { display: block; height: 100%; }
  .share i.axis { background: linear-gradient(180deg, #ff8a8a, #c93232); } .share i.allies { background: linear-gradient(180deg, #8cc2ff, #3a78d6); }

  .scroll { overflow-x: auto; }
  table.board { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.board th {
    text-align: right; color: var(--dim); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(0,0,0,.28);
    border-bottom: 1px solid var(--panel-lo); padding: 0.4rem 0.55rem; white-space: nowrap;
  }
  table.board th:first-child, table.board td:first-child { text-align: left; }
  table.board td { text-align: right; padding: 0.3rem 0.55rem; border-bottom: 1px solid rgba(0,0,0,.35); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.board td.name { font-weight: 600; max-width: 18em; }
  table.board td.name .who { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.board tr.player { cursor: pointer; }
  table.board tr.player.alt td { background: rgba(255,255,255,.03); }
  .mvp { color: var(--gold); margin-right: 0.25rem; cursor: help; }
  .pc-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.1rem 0 0.6rem; }
  .pc-actions button.clip { font-size: 0.8rem; padding: 4px 12px; margin: 0; }
  .pc-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.2rem, 1fr)); gap: 0.4rem; margin-bottom: 0.7rem; }
  .pc-tile { background: rgba(0,0,0,.3); border: 1px solid var(--panel-lo); border-radius: 3px; padding: 0.35rem 0.6rem; display: flex; flex-direction: column; min-width: 0; }
  .pc-tile .pl { font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .pc-tile b { font: 400 1.5rem/1.15 var(--display); letter-spacing: 0.02em; }
  .pc-tile .ps { font-size: 0.7rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 0.6rem; align-items: start; }
  .pc-box { background: rgba(0,0,0,.25); border: 1px solid var(--panel-lo); border-radius: 3px; padding: 0.4rem 0.7rem 0.6rem; min-width: 0; }
  .pc-box h4 { margin: 0 0 0.35rem; font: 400 0.8rem var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .moments .mrow { display: flex; justify-content: space-between; gap: 0.8rem; padding: 0.22rem 0; border-top: 1px solid rgba(255,255,255,.05); font-size: 0.82rem; }
  .moments .mrow:first-child { border-top: 0; }
  .moments .mrow span { color: var(--dim); }
  .moments .mrow b { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
  button.clip { font: 600 0.68rem var(--body, inherit); letter-spacing: 0.04em; color: var(--text); background: rgba(0,0,0,.4); border: 1px solid var(--edge); border-radius: 3px; padding: 1px 6px; margin-left: 0.3rem; cursor: pointer; white-space: nowrap; vertical-align: middle; }
  button.clip:hover { border-color: var(--link); color: #fff; }
  button.clip.potg { color: var(--gold); border-color: #6a3800; background: #3a2000; }
  table.board tr.player:hover td { background: rgba(0,0,0,.25); }
  table.board tr.player.open td { background: rgba(0,0,0,.35); }
  table.board tr.totals td { color: var(--dim); border-top: 1px solid var(--panel-lo); font-weight: 600; }
  .k { color: var(--ok); } .d { color: var(--bad); } .dmg { color: var(--gold); } .hs { color: var(--gold); }
  .caret { display: inline-block; width: 1em; color: var(--faint); }
  tr.player.open .caret::before { content: '\25BE'; }
  tr.player:not(.open) .caret::before { content: '\25B8'; }
  .tag { display: inline-block; font-size: 0.62rem; padding: 0 4px; border-radius: 3px; border: 1px solid var(--panel-hi); color: var(--faint); margin-left: 0.4rem; vertical-align: middle; }

  tr.detail > td { text-align: left; padding: 0.4rem 0.8rem 0.9rem 1.6rem; background: rgba(0,0,0,.2); }
  table.weapons { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 0.2rem 0 0.5rem; }
  table.weapons th { color: var(--dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; text-align: right; padding: 0.2rem 0.7rem; border-bottom: 1px solid var(--panel-lo); }
  table.weapons th:first-child, table.weapons td:first-child { text-align: left; }
  table.weapons td { text-align: right; padding: 0.18rem 0.7rem; font-variant-numeric: tabular-nums; }
  table.weapons td:first-child { color: var(--gold); }
  .extras { color: var(--dim); font-size: 0.82rem; display: flex; flex-wrap: wrap; gap: 0.2rem 1.4rem; margin-top: 0.3rem; }
  .extras b { color: var(--text); font-weight: 600; }
  .none { color: var(--faint); font-size: 0.85rem; }

  .honours { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: 1.1rem; }
  .card { display: flex; flex-direction: column; position: relative; border: 2px solid; border-color: var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi); outline: 1px solid #000; background: var(--panel); overflow: hidden; }
  .card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--ac); }
  .card.fame { --ac: linear-gradient(90deg, var(--gold), #fff1b8, var(--gold)); }
  .card.shame { --ac: linear-gradient(90deg, #7a1b16, var(--bad), #7a1b16); }
  .card h3 { margin: 0; padding: 0.75rem 0.9rem 0.5rem; font: 400 1.25rem/1.1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 0.5rem; }
  .card h3 .ico { font-size: 1.1rem; }
  .card.fame h3 { color: var(--gold); text-shadow: 0 0 14px rgba(214,178,90,.35), 1px 1px 0 #000; }
  .card.shame h3 { color: var(--bad); text-shadow: 0 0 14px rgba(255,107,94,.3), 1px 1px 0 #000; }
  .card ul { flex: 1 1 auto; list-style: none; margin: 0; padding: 0.2rem 0.9rem 0.6rem; font-size: 0.86rem; background: var(--inset); }
  .card li { display: flex; gap: 0.5rem; padding: 0.28rem 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .card li:last-child { border-bottom: 0; }
  .card li .t { color: var(--dim); flex: 0 1 10em; min-width: 5.5em; }   /* long titles wrap rather than take the name's room */
  .card li .p { color: var(--text); font-weight: 600; flex: 1 1 auto; min-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* the name always keeps room, whatever the value is */
  .card li .v { color: var(--text); opacity: .75; flex: 0 1 auto; text-align: right; min-width: 0; }   /* wraps onto a second line in a narrow card instead of overflowing it */
  .card.fame li .v { color: var(--gold); opacity: 1; } .card.shame li .v { color: #ffb0a8; opacity: 1; }
  .card .none { flex: 1 1 auto; padding: 0.5rem 0.9rem 0.8rem; background: var(--inset); }
  .facts { display: flex; flex-wrap: wrap; gap: 0.3rem 0.5rem; margin: 0.1rem 0 0.6rem; }
  .fact { font-size: 0.78rem; color: var(--dim); background: rgba(0,0,0,.28); border: 1px solid var(--panel-lo); border-radius: 3px; padding: 1px 7px; white-space: nowrap; }
  .fact b { color: var(--text); font-weight: 600; }
  .timeline-link { display: inline-block; padding: 1px 9px; border: 1px solid var(--panel-hi); border-radius: 3px; color: var(--link); }
  .timeline-link:hover { border-color: var(--link); text-decoration: none; }

  .grp-toggle { color: var(--dim); font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.3rem; cursor: pointer; }
  ol.feed-list li.grp { display: block; padding: 0.2rem 0.4rem; }
  ol.feed-list li.grp .fight { margin: 0; }
  .fight { border: 1px solid var(--panel-lo); border-radius: 6px; background: rgba(0,0,0,.18); margin-bottom: 0.35rem; }
  .fight > summary { cursor: pointer; padding: 0.4rem 0.7rem; display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; align-items: baseline; font-size: 0.88rem; list-style: none; }
  .fight > summary::-webkit-details-marker { display: none; }
  .fight > summary::before { content: '\25B8'; color: var(--faint); }
  .fight[open] > summary::before { content: '\25BE'; }
  .fight .when { color: var(--faint); font-family: var(--mono); flex: 0 0 3.2rem; }
  .fight .size { font-weight: 700; color: var(--text); }
  .fight .won-ax { color: #f66; } .fight .won-al { color: #6af; } .fight .even { color: var(--faint); }
  .fight .nums { color: var(--dim); }
  .fight .ax { color: #f66; } .fight .al { color: #6af; }
  .fight .body { padding: 0.2rem 0.8rem 0.7rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.2rem 1.4rem; font-size: 0.84rem; }
  .fight .side h4 { margin: 0.3rem 0 0.2rem; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .fight .side.axis h4 { color: #f66; } .fight .side.allies h4 { color: #6af; }
  .fight .pl { display: flex; justify-content: space-between; gap: 0.6rem; padding: 0.05rem 0; }
  .fight .pl.dead .n { text-decoration: line-through; color: var(--faint); }
  .fight .pl .v { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fight ol.fight-feed { grid-column: 1 / -1; margin-top: 0.4rem; max-height: none; }
  .fight .links { grid-column: 1 / -1; font-size: 0.8rem; }
  .fight .body > * { min-width: 0; }
  .hpwrap { position: relative; height: 22px; margin: 0 0 0.35rem; }
  .hpwrap svg.hp { display: block; width: 100%; height: 100%; background: rgba(0,0,0,.22); border-radius: 2px; }
  .hpwrap .kd { position: absolute; top: 1px; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 2px #000; }
  .fight .pl .flag { color: #f5c518; }
  .fight .pl .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  @media (max-width: 640px) {
    .fight .body { grid-template-columns: 1fr; padding-left: 0.5rem; padding-right: 0.5rem; }
    .fight .pl .v { white-space: normal; text-align: right; }   /* the numbers wrap rather than push the page sideways */
  }
  .feed-tools { display: flex; flex-wrap: wrap; gap: 0.5rem 0.8rem; align-items: center; padding: 0.55rem 0.9rem; background: rgba(0,0,0,.18); border-bottom: 1px solid var(--panel-lo); }
  .chip { font: inherit; font-size: 0.78rem; color: var(--dim); background: rgba(0,0,0,.25); border: 1px solid var(--panel-lo); border-radius: 12px; padding: 2px 11px; cursor: pointer; }
  .chip.on { color: var(--text); border-color: var(--link); background: rgba(143,208,255,.14); }
  .chip:hover { border-color: var(--edge); }
  .feed-tools input[type=text] { background: rgba(0,0,0,.25); border: 1px solid var(--panel-lo); color: var(--text); padding: 0.25rem 0.6rem; border-radius: 3px; font-family: var(--mono); font-size: 0.82rem; outline: none; width: 11rem; }
  .feed-tools input[type=text]:focus { border-color: var(--faint); }
  .feed-count { color: var(--faint); font-size: 0.8rem; }
  ol.feed-list { list-style: none; margin: 0; padding: 0; font-size: 0.85rem; max-height: 36rem; overflow-y: auto; background: var(--inset); }
  ol.feed-list li { display: flex; gap: 0.7rem; padding: 0.2rem 0.7rem; border-bottom: 1px solid rgba(0,0,0,.25); }
  ol.feed-list li:last-child { border-bottom: 0; }
  ol.feed-list .ts { color: var(--faint); font-family: var(--mono); flex: 0 0 3.6rem; }
  ol.feed-list .tx { color: var(--dim); }
  ol.feed-list .nm { color: var(--text); font-weight: 600; }
  ol.feed-list .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  ol.feed-list .dot.ax { background: #f66; } ol.feed-list .dot.al { background: #6af; } ol.feed-list .dot.nt { background: var(--faint); }
  ol.feed-list .w { color: var(--gold); }
  ol.feed-list .hs { color: var(--gold); font-size: 0.72rem; border: 1px solid #6a3800; border-radius: 3px; padding: 0 4px; margin-left: 0.3rem; }
  ol.feed-list li.tk .tx { color: var(--bad); }
  ol.feed-list li.obj .tx { color: var(--ok); }
  ol.feed-list li.sup .tx { color: var(--dim); }
  ol.feed-list li.meta .tx { color: var(--faint); font-style: italic; }
  .feed-more { margin: 0.5rem 0.9rem 0.7rem; }

  .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
  .seg button { font: inherit; font-size: 0.8rem; color: var(--dim); background: rgba(0,0,0,.3); border: 0; padding: 3px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--edge); }
  .seg button.on { color: var(--text); background: rgba(143,208,255,.2); }
  .acc-row { display: grid; grid-template-columns: 7em minmax(0, 1.3fr) minmax(0, 2fr) 6.5em 4.5em; align-items: center; gap: 0.2rem 0.8rem; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 0.86rem; }
  .acc-row:last-child { border-bottom: 0; }
  .acc-row .w { color: var(--gold); font-weight: 600; }
  .acc-row .pn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc-row .n { color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .acc-bar { position: relative; height: 1.25rem; border-radius: 3px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.07); overflow: hidden; }
  .acc-bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #2e7d3a, #7be26a); }
  .acc-bar.low i { background: linear-gradient(90deg, #8a2a22, #ff6b5e); }
  .acc-bar span { position: relative; display: block; padding: 0 0.5rem; font-size: 0.78rem; font-weight: 700; line-height: 1.2rem; color: #fff; text-shadow: 1px 1px 0 #000; font-variant-numeric: tabular-nums; }
  .acc-head span { white-space: nowrap; }
  .acc-head { color: var(--dim); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--panel-lo); padding-bottom: 0.25rem; }
  .acc-head:hover { background: none; }
  p.quiet { text-align: center; margin: 1.2rem 0 0.4rem; font-size: 0.75rem; }
  p.quiet a { color: var(--faint); }
  .fine-note { color: var(--faint); font-size: 0.78rem; padding: 0.6rem 0.9rem 0.7rem; border-top: 1px solid var(--panel-lo); background: rgba(0,0,0,.12); }

  @media (max-width: 780px) { .honours { grid-template-columns: minmax(0, 1fr); } }   /* two cards side by side get too cramped for the names */
  @media (max-width: 640px) {
    .dt { display: none; }           /* long extras (weapon and victim of the longest kill) would make the page scroll sideways */
    .honours { grid-template-columns: minmax(0, 1fr); }
    /* title and value share the first line and the player gets the whole second one, so no name is cut short on a phone */
    .card li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 0.6rem; }
    .card li .t { grid-column: 1; min-width: 0; }
    .card li .v { grid-column: 2; grid-row: 1; }
    .card li .p { grid-column: 1 / -1; min-width: 0; padding-left: 0.1rem; }
    /* accuracy: weapon and kills/deaths on the first line, the player on the second and the bar under it */
    .acc-row { grid-template-columns: minmax(0, 1fr) auto; gap: 0.1rem 0.6rem; padding: 0.4rem 0; }
    .acc-row .w { grid-column: 1; } .acc-row .kd { grid-column: 2; grid-row: 1; }
    .acc-row .pn { grid-column: 1 / -1; }
    .acc-row .acc-bar { grid-column: 1 / -1; }
    .acc-row .h { display: none; }
    .acc-head { display: none; }
    .opt { display: none; }          /* the board has to fit a phone: drop suicides, team kills, damage received and team damage */
    tr.detail > td { padding-left: 0.6rem; }
    .pc-cols { grid-template-columns: minmax(0, 1fr); }
    .pc-tile b { font-size: 1.25rem; }
            table.board td.name { max-width: 7.5em; }
    table.board th, table.board td { padding-left: 0.3rem; padding-right: 0.3rem; }

<script>
'use strict';

const params = new URLSearchParams(location.search);
const match = params.get('r') || '';
const RETRY_MS = [1000, 2000, 4000, 8000];
// only the pistols, SMGs and the rifle can score headshots (the game's own table does the same)
const HS_WEAPONS = new Set(['Luger','Colt','MP-40','Thompson','Sten','Sniper']);
const ROW_WEAPONS = new Set(['Healthpacks','Ammopacks']);   // shown as lines under the table, not rows

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// the game's names may carry ^N colour codes from older data; strip them for display
function clean(s) { return String(s || '').replace(/\^[0-9A-Za-z]/g, ''); }
function pct(h, a) { return a > 0 ? (h * 100 / a).toFixed(1) : ''; }


// Quake colour codes in names.  The engine's 32-entry table (digits, then : ; < = > ? @, then A-O), indexed by (char - '0') & 31, as
// q3master's name rendering does; one caret before another caret is a literal caret.  Near-black colours are lightened so they can
// be read on this dark page.
const Q3_COLORS = [
  '#000000', '#FF0000', '#00FF00', '#FFFF00', '#0000FF', '#00FFFF', '#FF00FF', '#FFFFFF',
  '#FF8000', '#808080', '#BFBFBF', '#BFBFBF', '#008000', '#808000', '#000080', '#800000',
  '#804000', '#FF991A', '#008080', '#800080', '#0080FF', '#8000FF', '#3399CC', '#CCFFCC',
  '#006633', '#FF0033', '#B21A1A', '#993300', '#CC9933', '#999933', '#FFFFBF', '#FFFF80',
];
function readable(hex) {
  const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  if (0.2126 * r + 0.7152 * g + 0.0722 * b >= 70) return hex;           // bright enough
  const mix = c => Math.round(c + (255 - c) * 0.6).toString(16).padStart(2, '0');
  return '#' + mix(r) + mix(g) + mix(b);
}
function colorName(raw) {
  let out = '', color = null, run = '';
  const flush = () => { if (run) { out += color ? '<span style="color:' + color + '">' + run + '</span>' : run; run = ''; } };
  for (let i = 0; i < raw.length; i++) {
    const ch = raw[i];
    if (ch === '^' && i + 1 < raw.length) {
      if (raw[i + 1] === '^') { run += '^'; i++; continue; }          // "^^": a literal caret
      flush();
      const code = raw[++i];
      color = code === '7' ? null : readable(Q3_COLORS[(code.charCodeAt(0) - 0x30) & 31]);   // ^7 is the plain colour
      continue;
    }
    run += esc(ch);
  }
  flush();
  return out || '&nbsp;';
}
// a player's name for display: coloured when the game gave us the raw name, plain otherwise
const rawByName = {};
function nm(name) {
  return rawByName[name] ? colorName(rawByName[name]) : esc(clean(name));
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString(undefined, {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
}

function weaponTable(p) {  // the weapons table of a player card
  const w = p.weapons || [];
  const byName = {};
  w.forEach(x => byName[x.name] = x);
  const rows = w.filter(x => !ROW_WEAPONS.has(x.name) && x.name !== 'Syringe');
  const syringe = byName['Syringe'], health = byName['Healthpacks'], ammo = byName['Ammopacks'];
  let html = '';
  if (!rows.length && !syringe && !health && !ammo) return '<div class="none">No weapon info for this player.</div>';
  html += '<table class="weapons"><thead><tr><th>Weapon</th><th>Acrcy</th><th>Hits/Atts</th><th>Kll</th><th>Dth</th><th>HS</th></tr></thead><tbody>';
  rows.forEach(x => {
    const shots = x.atts || x.hits;
    html += '<tr><td>' + esc(x.name) + '</td>' +
      '<td>' + (shots ? pct(x.hits, x.atts) : '') + '</td>' +
      '<td>' + (shots ? x.hits + '/' + x.atts : '') + '</td>' +
      '<td class="k">' + x.kills + '</td><td class="d">' + x.deaths + '</td>' +
      '<td class="hs">' + (HS_WEAPONS.has(x.name) ? x.headshots : '') + '</td></tr>';
  });
  html += '</tbody></table>';
  const extras = [];
  if (syringe && (syringe.atts || syringe.hits)) extras.push('<span>Revivals <b>' + syringe.hits + '</b>' + (syringe.atts ? ' of ' + syringe.atts + ' syringe uses' : '') + '</span>');
  if (health && health.atts) extras.push('<span>Health packs <b>' + health.hits + '</b> used / <b>' + health.atts + '</b> dropped</span>');
  if (ammo && ammo.atts) extras.push('<span>Ammo packs <b>' + ammo.hits + '</b> used / <b>' + ammo.atts + '</b> dropped</span>');
  if (extras.length) html += '<div class="extras">' + extras.join('') + '</div>';
  return html;
}

function fmtClock(ms) {
  const s = Math.round((ms || 0) / 1000), m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

// the moments of a player card: streaks, multi-kills, objectives, first blood, rivals ...
function playerFacts(p) {
  const f = [];
  const add = (label, value) => f.push('<div class="mrow"><span>' + label + '</span><b>' + value + '</b></div>');
  if (p.kill_streak >= 2) add('Best streak', p.kill_streak + ' kills');
  if (p.death_streak >= 3) add('Worst dry spell', p.death_streak + ' deaths');
  const multi = [];
  if (p.double_kills) multi.push(p.double_kills + '&times; double');
  if (p.triple_kills) multi.push(p.triple_kills + '&times; triple');
  if (p.quad_kills) multi.push(p.quad_kills + '&times; quad+');
  if (multi.length) add('Multi-kills', multi.join(', '));
  if (p.objectives) {
    const o = p.objectives, parts = [];
    if (o.plants) parts.push(o.plants + ' planted');
    if (o.defuses) parts.push(o.defuses + ' defused');
    if (o.captures) parts.push(o.captures + ' captured');
    if (o.steals) parts.push(o.steals + ' picked up');
    if (o.returns) parts.push(o.returns + ' returned');
    if (o.denials) parts.push(o.denials + ' denied');
    if (parts.length) add('Objectives', parts.join(', '));
  }
  if (p.first_blood) add('First blood', p.first_blood > 1 ? p.first_blood + ' rounds' : 'yes');
  if (p.first_death) add('First to die', p.first_death > 1 ? p.first_death + ' rounds' : 'yes');
  if (p.favorite_victim) add('Favorite victim', nm(p.favorite_victim.name) + ' &times;' + p.favorite_victim.n);
  if (p.nemesis) add('Nemesis', nm(p.nemesis.name) + ' &times;' + p.nemesis.n);
  if (p.longest_kill) add('Longest kill', (p.longest_kill.dist * 0.0254).toFixed(1) + ' m<span class="dt"> (' + esc(p.longest_kill.weapon) + ' on ' + nm(p.longest_kill.victim) + ')</span>');
  if (p.knife_kills) add('Knife kills', p.knife_kills);
  if (p.goombas) add('Goombas', p.goombas);
  if (p.poisons) add('Poison kills', p.poisons);
  if (p.team_gibs) add('Team gibs', p.team_gibs);
  return f.length ? '<div class="moments">' + f.join('') + '</div>' : '<div class="none">Nothing stands out yet.</div>';
}

// the player card that opens under a row: headline numbers, then weapons and moments side by side
function playerCard(p) {
  const w = (p.weapons || []).filter(x => !ROW_WEAPONS.has(x.name) && x.name !== 'Syringe');
  const hits = w.reduce((a, x) => a + (x.atts ? x.hits : 0), 0), atts = w.reduce((a, x) => a + (x.atts || 0), 0);
  const hs = w.reduce((a, x) => a + (HS_WEAPONS.has(x.name) ? x.headshots || 0 : 0), 0);
  const kd = p.deaths ? (p.kills / p.deaths).toFixed(2) : String(p.kills);
  const tile = (label, value, sub) => '<div class="pc-tile"><span class="pl">' + label + '</span><b>' + value + '</b>' + (sub ? '<span class="ps">' + sub + '</span>' : '') + '</div>';
  let tiles = tile('K / D', kd, p.kills + ' kills &middot; ' + p.deaths + ' deaths') +
    tile('Efficiency', p.eff + '%', 'Fight win rate') +
    tile('Damage', p.damage_given, p.damage_received + ' taken') +
    (atts ? tile('Accuracy', (100 * hits / atts).toFixed(0) + '%', hits + ' of ' + atts + ' shots') : '') +
    (hs ? tile('Headshots', hs, '') : '') +
    (p.play_ms >= 60000 ? tile('Pace', (p.kills * 60000 / p.play_ms).toFixed(1), 'kills/min over ' + fmtClock(p.play_ms)) : '');
  return clipChips(p) + '<div class="pc-tiles">' + tiles + '</div>' +
    '<div class="pc-cols"><div class="pc-box"><h4>Weapons</h4>' + weaponTable(p) + '</div>' +
    '<div class="pc-box"><h4>Moments</h4>' + playerFacts(p) + '</div></div>';
}

function honoursCard(cls, title, list, emptyText) {
  let html = '<div class="card ' + cls + '"><h3><span class="ico">' + (cls === 'fame' ? '&#9733;' : '&#9760;') + '</span>' + title + '</h3>';
  if (!list || !list.length) return html + '<div class="none">' + emptyText + '</div></div>';
  html += '<ul>';
  list.forEach(a => {
    html += '<li><span class="t">' + esc(a.title) + '</span><span class="p">' + nm(a.player) + '</span><span class="v">' + esc(a.value) + (a.detail ? '<span class="dt"> (' + esc(a.detail) + ')</span>' : '') + '</span></li>';
  });
  return html + '</ul></div>';
}

// Play of the game and highlight buttons.  `clips` comes from the games list; it is null if that failed or the
// recording is gone, in which case nothing is offered.
let clips = null;
function clipFor(p) {
  if (!clips) return { potg: false, hl: null };
  const key = clean(p.name).toLowerCase();
  const hl = (clips.highlights || []).find(h => clean(h.name).toLowerCase() === key);
  return { potg: !!clips.potg_player && clean(clips.potg_player).toLowerCase() === key, hl: hl || null };
}
function clipChips(p) {
  const c = clipFor(p);
  let h = '';
  if (c.potg) h += '<button type="button" class="clip potg" data-clip="potg" title="Watch the play of the game">&#9654; POTG</button>';
  if (c.hl) h += '<button type="button" class="clip" data-clip="' + c.hl.player + '" title="Watch this player\'s best play">&#9654; Highlight</button>';
  return h ? '<div class="pc-actions">' + h + '</div>' : '';
}

function teamTable(label, cls, players, isWinner) {
  if (!players.length) return '';
  const tot = {kills:0, deaths:0, suicides:0, teamkills:0, gibs:0, damage_given:0, damage_received:0, team_damage:0, score:0};
  players.forEach(p => { for (const k in tot) tot[k] += p[k] || 0; });
  const eff = tot.kills + tot.deaths ? Math.floor(100 * tot.kills / (tot.kills + tot.deaths)) : 0;
  let html = '<div class="sect panel ' + cls + '-panel"><div class="sect-head ' + cls + '"><h3>' + label + '</h3>' +
    '<span class="sub">' + players.length + ' player' + (players.length === 1 ? '' : 's') + '</span>' +
    (isWinner ? '<span class="right"><span class="winner-badge">WINNER</span></span>' : '') + '</div>' +
    '<div class="sect-body flush scroll"><table class="board"><thead><tr><th>Player</th><th>Kll</th><th>Dth</th><th class="opt">Sui</th><th class="opt">TK</th><th>Eff</th><th class="opt">Gib</th><th>DG</th><th class="opt">DR</th><th class="opt">TD</th><th>Score</th></tr></thead><tbody>';
  players.forEach((p, i) => {
    html += '<tr class="player' + (i % 2 ? ' alt' : '') + '" data-i="' + cls + i + '" tabindex="0" role="button" aria-expanded="false" title="Show weapon stats">' +
      '<td class="name"><span class="who"><span class="caret"></span>' + (clipFor(p).potg ? '<span class="mvp" title="Play of the game">&#9733;</span>' : '') + '<span>' + nm(p.name) + (p.bot ? '<span class="tag">BOT</span>' : '') + '</span></span></td>' +
      '<td class="k">' + p.kills + '</td><td class="d">' + p.deaths + '</td><td class="opt">' + p.suicides + '</td><td class="opt">' + p.teamkills + '</td>' +
      '<td>' + p.eff + '</td><td class="opt">' + p.gibs + '</td>' +
      '<td class="dmg">' + p.damage_given + '</td><td class="opt">' + p.damage_received + '</td><td class="opt">' + p.team_damage + '</td>' +
      '<td class="sc"><b>' + p.score + '</b></td></tr>' +
      '<tr class="detail" data-for="' + cls + i + '" style="display:none"><td colspan="11">' + playerCard(p) + '</td></tr>';
  });
  html += '<tr class="totals"><td>Totals</td><td>' + tot.kills + '</td><td>' + tot.deaths + '</td><td class="opt">' + tot.suicides + '</td><td class="opt">' + tot.teamkills +
    '</td><td>' + eff + '</td><td class="opt">' + tot.gibs + '</td><td>' + tot.damage_given + '</td><td class="opt">' + tot.damage_received + '</td><td class="opt">' + tot.team_damage +
    '</td><td>' + tot.score + '</td></tr></tbody></table></div></div>';
  return html;
}

function shotsTable(rows) {
  if (!rows.length) return '<div class="none">No qualifying shot info (a player needs enough shots with a weapon to be ranked).</div>';
  let html = '<div class="acc-row acc-head"><span>Weapon</span><span>Player</span><span>Accuracy</span><span style="text-align:right">Hits / shots</span><span style="text-align:right">K / D</span></div>';
  rows.forEach(r => {
    const acc = r.atts > 0 ? 100 * r.hits / r.atts : 0;
    html += '<div class="acc-row"><span class="w">' + esc(r.weapon) + '</span><span class="pn">' + nm(r.player) + '</span>' +
      '<div class="acc-bar' + (acc < 15 ? ' low' : '') + '"><i style="width:' + Math.min(100, acc).toFixed(1) + '%"></i><span>' + acc.toFixed(1) + '%</span></div>' +
      '<span class="n h">' + r.hits + '/' + r.atts + '</span><span class="n kd"><span class="k">' + r.kills + '</span> / <span class="d">' + r.deaths + '</span></span></div>';
  });
  return html;
}

function render(g) {
  const players = g.players || [];
  players.forEach(p => { if (p.name_raw) rawByName[p.name] = p.name_raw; });
  document.title = g.map + ' stats — S4NDMoD26';
  const hero = document.getElementById('hero');
  hero.style.setProperty('--shot', "url('/api/levelshot/" + encodeURIComponent(g.map) + "')");
  const chips = [];
  if (g.started_at) chips.push('<span class="pill"><b>' + esc(fmtDate(g.started_at)) + '</b></span>');
  chips.push('<span class="pill"><b>' + (g.rounds || 1) + '</b> round' + ((g.rounds || 1) === 1 ? '' : 's') + (g.rounds > 1 ? ' &middot; stats added together' : '') + '</span>');
  chips.push('<span class="pill"><b>' + players.length + '</b> players</span>');
  if (g.winner) {
    const name = g.winner === 'axis' ? 'Axis' : 'Allies';
    let extra = '';
    if ((g.round_winners || []).length > 1) {
      extra = ' &middot; ' + g.round_winners.map(r => 'round ' + r.round + ': ' + (r.winner === 'axis' ? 'Axis' : 'Allies')).join(', ');
    }
    chips.push('<span class="pill won-' + g.winner + '"><b>' + name + '</b> won' + extra + '</span>');
  }
  hero.innerHTML = '<div class="eyebrow">Game report</div><h2>' + esc(g.map) + '</h2><div class="chips">' + chips.join('') + '</div>' +
    '<div class="actions"><a class="btn primary" href="/paths.html?r=' + encodeURIComponent(g.match) + '" title="Everyone\'s movement through the game, drawn in 3D on the map">Movement in 3D &rarr;</a>' +
    (clips && clips.potg_player ? '<button type="button" class="btn clip-btn" data-clip="potg" title="Watch the play of the game">&#9654; Play of the game: ' + esc(clean(clips.potg_player)) + '</button>' : '') + '</div>';
  // the old timeline stays, but out of the way
  const tl = document.getElementById('timeline-quiet');
  if (tl) tl.href = '/timeline.html?mode=replay&r=' + encodeURIComponent(g.match);

  // the result: each team's totals and the share of kills
  const sums = t => { const ps = players.filter(p => p.team === t); const s = { n: ps.length, kills: 0, deaths: 0, dmg: 0, score: 0, revives: 0 }; ps.forEach(p => { s.kills += p.kills; s.deaths += p.deaths; s.dmg += p.damage_given; s.score += p.score; s.revives += p.revives || 0; }); return s; };
  const ax = sums('axis'), al = sums('allies'), kt = ax.kills + al.kills;
  const tile = (cls, label, s) => '<div class="tile ' + cls + (g.winner === cls ? ' win' : '') + '"><div class="tname">' + label + (g.winner === cls ? '<span class="winner-badge">WINNER</span>' : '') + '</div>' +
    '<div class="big">' + s.kills + '<small>kills</small></div><div class="stats"><span><b>' + s.dmg + '</b> damage</span><span><b>' + s.deaths + '</b> deaths</span><span><b>' + s.revives + '</b> revives</span><span><b>' + s.n + '</b> player' + (s.n === 1 ? '' : 's') + '</span></div></div>';
  document.getElementById('scoreline').innerHTML = tile('axis', 'Axis', ax) + tile('allies', 'Allies', al) +
    (kt ? '<div class="share" title="Share of all kills: Axis ' + ax.kills + ', Allies ' + al.kills + '"><i class="axis" style="width:' + (100 * ax.kills / kt).toFixed(1) + '%"></i><i class="allies" style="width:' + (100 * al.kills / kt).toFixed(1) + '%"></i></div>' : '');

  document.getElementById('honours').innerHTML =
    honoursCard('fame', 'Awards', g.awards, 'Not enough played for awards.') +
    honoursCard('shame', 'Hall of shame', g.shame, 'Nobody to blame.');

  document.getElementById('teams').innerHTML =
    teamTable('Axis', 'axis', players.filter(p => p.team === 'axis'), g.winner === 'axis') +
    teamTable('Allies', 'allies', players.filter(p => p.team === 'allies'), g.winner === 'allies');

  let showBest = true;
  const shots = document.getElementById('shots');
  function drawShots() {
    shots.innerHTML = '<div class="sect-head"><h3>Accuracy</h3><span class="sub">by weapon</span><div class="right"><div class="seg" role="group" aria-label="Which accuracies to show">' +
      '<button type="button" data-b="1" class="' + (showBest ? 'on' : '') + '" aria-pressed="' + showBest + '">Best</button><button type="button" data-b="0" class="' + (showBest ? '' : 'on') + '" aria-pressed="' + !showBest + '">Worst</button></div></div></div>' +
      '<div class="sect-body">' + shotsTable(showBest ? (g.topshots || []) : (g.bottomshots || [])) + '</div>' +
      '<div class="fine-note">Accuracy is calculated per weapon for players who meet a minimum shot threshold (lower for sniper rifles and explosives). Explosives and flamethrowers can exceed 100% accuracy because a single attack can hit multiple players.</div>';
    shots.querySelectorAll('.seg button').forEach(b => b.onclick = () => { showBest = b.dataset.b === '1'; drawShots(); });
  }
  drawShots();

  // click (or Enter / Space) on a player to open their weapon table
  function toggle(tr) {
    const detail = document.querySelector('tr.detail[data-for="' + tr.dataset.i + '"]');
    const open = detail.style.display === 'none';
    detail.style.display = open ? '' : 'none';
    tr.classList.toggle('open', open);
    tr.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  document.querySelectorAll('[data-clip]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    openPotgPlayer(match, b.dataset.clip === 'potg' ? undefined : b.dataset.clip);
  }));
  document.querySelectorAll('tr.player').forEach(tr => {
    tr.onclick = () => toggle(tr);
    tr.onkeydown = e => { if (e.target !== tr) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(tr); } };
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('game').style.display = '';
  loadFights();
  loadFeed();
}

// ---- the event feed (kills, revives, objectives, joins) -------------------------------------------------------------
const FEED_GROUPS = S4Feed.GROUPS;
const feedState = { events: [], on: Object.fromEntries(Object.keys(S4Feed.GROUPS).map(k => [k, !S4Feed.GROUPS[k].off])), text: '', shown: 300, fights: [], group: true, rendered: false };
try { if (localStorage.getItem('groupFights') === '0') feedState.group = false; } catch (e) { /* no storage: keep the default */ }

const fmtFeedTime = S4Feed.time;

function feedLine(e) {
  const l = S4Feed.line(e, nm);
  return '<li class="' + l.cls + '"><span class="ts">' + fmtFeedTime(e.t_ms) + '</span><span class="tx">' + l.html + '</span></li>';
}

// Which fight (if any) a feed event belongs to: the kill or revive the fight lists at the same moment between the same two players.
function fightIndexOf(e) {
  if (e.type !== 'kill' && e.type !== 'revive') return -1;
  for (let i = 0; i < feedState.fights.length; i++) {
    const f = feedState.fights[i];
    if (e.type === 'kill' && f.kills.some(k => Math.abs(k.t - e.t_ms) <= 300 && k.killer === e.actor && k.victim === e.target)) return i;
    if (e.type === 'revive' && (f.revives || []).some(r => Math.abs(r.t - e.t_ms) <= 300 && r.medic === e.actor && r.revived === e.target)) return i;
  }
  return -1;
}

function drawFeed() {
  const types = new Set();
  Object.keys(FEED_GROUPS).forEach(k => { if (feedState.on[k]) FEED_GROUPS[k].types.forEach(t => types.add(t)); });
  const q = feedState.text.trim().toLowerCase();
  const grouping = feedState.group && feedState.fights.length > 0;
  const items = [];                       // { t, html } in time order: plain rows and (when grouping) fights
  feedState.events.forEach(e => {
    if (!types.has(e.type)) return;
    if (q && !((e.actor || '').toLowerCase().includes(q) || (e.target || '').toLowerCase().includes(q))) return;
    if (grouping && fightIndexOf(e) >= 0) return;          // it is shown inside its fight
    items.push({ t: e.t_ms, html: feedLine(e) });
  });
  let fightCount = 0;
  if (grouping) {
    feedState.fights.forEach(f => {
      if (q && !f.sides.some(s => s.players.some(p => (p.name || '').toLowerCase().includes(q)))) return;
      fightCount++;
      items.push({ t: f.start_ms, html: '<li class="grp">' + fightHtml(f) + '</li>' });
    });
    items.sort((a, b) => a.t - b.t);
  }
  const shown = items.slice(0, feedState.shown);
  const n = items.length - fightCount;
  document.getElementById('feed-count').textContent = n + ' event' + (n === 1 ? '' : 's') + (grouping ? ' + ' + fightCount + ' fight' + (fightCount === 1 ? '' : 's') : '');
  document.getElementById('feed-list').innerHTML = shown.length ? shown.map(x => x.html).join('') : '<li><span class="tx">Nothing to show.</span></li>';
  const more = document.getElementById('feed-more');
  more.style.display = items.length > shown.length ? '' : 'none';
  more.textContent = 'Show more (' + (items.length - shown.length) + ' left)';
}

function renderFeed(events) {
  feedState.events = events || [];
  const box = document.getElementById('feed');
  if (!feedState.events.length) return;
  let chips = '';
  Object.keys(FEED_GROUPS).forEach(k => {
    chips += '<button type="button" class="chip' + (feedState.on[k] ? ' on' : '') + '" data-g="' + k + '" aria-pressed="' + feedState.on[k] + '">' + FEED_GROUPS[k].label + '</button>';
  });
  box.innerHTML = '<div class="sect-head"><h3>Event feed</h3><span class="sub">kills, revives and objectives, with the fights in them</span></div><div class="feed-tools">' + chips +
    '<input type="text" id="feed-q" placeholder="Filter by player&hellip;" aria-label="Filter the feed by player">' +
    '<label class="grp-toggle" id="grp-wrap" style="display:none" title="Show each fight as one row you can open, with its kills and revives inside"><input type="checkbox" id="feed-group"> Group fights</label>' +
    '<span class="feed-count" id="feed-count"></span></div>' +
    '<ol class="feed-list" id="feed-list"></ol>' +
    '<button type="button" class="chip feed-more" id="feed-more" style="display:none"></button>';
  box.style.display = '';
  box.querySelectorAll('.chip[data-g]').forEach(b => b.onclick = () => {
    feedState.on[b.dataset.g] = !feedState.on[b.dataset.g];
    b.classList.toggle('on', feedState.on[b.dataset.g]);
    b.setAttribute('aria-pressed', feedState.on[b.dataset.g]);
    feedState.shown = 300; drawFeed();
  });
  const grp = document.getElementById('feed-group');
  grp.checked = feedState.group;
  grp.onchange = () => {
    feedState.group = grp.checked;
    try { localStorage.setItem('groupFights', grp.checked ? '1' : '0'); } catch (e) { /* not remembered */ }
    feedState.shown = 300; drawFeed();
  };
  document.getElementById('grp-wrap').style.display = feedState.fights.length ? '' : 'none';
  feedState.rendered = true;
  document.getElementById('feed-q').oninput = e => { feedState.text = e.target.value; feedState.shown = 300; drawFeed(); };
  document.getElementById('feed-more').onclick = () => { feedState.shown += 300; drawFeed(); };
  drawFeed();
}

// The feed is a bonus: if it cannot be loaded the stats page is still complete.
const FIGHT_LABEL = { '1v1': '', focus_fire: 'focus fire', ambush: 'ambush', team_fight: '', skirmish: 'skirmish', clutch: 'clutch' };
// A player's health through a fight: a step line (each value holds until the next) that ends where they die and only picks up again if
// they are back in the fight, the fight's own span lightly shaded, a red line at each death, a green one at each revive and a small dot at each kill they made.
function hpChart(f, p, team) {
  const pts = p.health || [];
  if (pts.length < 2) return '';
  const t0 = f.start_ms - 1000, t1 = f.end_ms + 1000, span = Math.max(1, t1 - t0);
  const top = Math.max(120, ...pts.map(h => h[1]));
  const X = t => (100 * (Math.min(t1, Math.max(t0, t)) - t0) / span).toFixed(2);
  const Y = h => (22 - 20 * Math.max(0, h) / top).toFixed(2);
  // A point at 0 HP is a death: the line drops there and stops (a red mark), and a later point above 0 starts a new stretch (they are
  // back in the fight, e.g. at a spawn).
  let d = '', open = false, deaths = '';
  pts.forEach(([t, h]) => {
    if (h > 0) {
      d += open ? ' H' + X(t) + ' V' + Y(h) : ' M' + X(t) + ' ' + Y(h);
      open = true;
    } else if (open) {
      d += ' H' + X(t) + ' V' + Y(0);
      deaths += '<line x1="' + X(t) + '" y1="0" x2="' + X(t) + '" y2="24" stroke="#e33" stroke-width="2" vector-effect="non-scaling-stroke"/>';
      open = false;
    }
  });
  // a revive is a green line at the moment the medic brought them back
  (f.revives || []).forEach(r => {
    if (r.rslot === p.slot && r.t >= t0 && r.t <= t1) deaths += '<line x1="' + X(r.t) + '" y1="0" x2="' + X(r.t) + '" y2="24" stroke="#3d3" stroke-width="2" vector-effect="non-scaling-stroke"><title>revived by ' + esc(r.medic) + '</title></line>';
  });
  const colour = team === 'axis' ? '#f66' : '#6af';
  let svg = '<svg class="hp" viewBox="0 0 100 24" preserveAspectRatio="none" role="img" aria-label="Health through the fight">' +
    '<rect x="' + X(f.start_ms) + '" y="0" width="' + (X(f.end_ms) - X(f.start_ms)).toFixed(2) + '" height="24" fill="rgba(255,200,50,.07)"/>' +
    '<line x1="0" y1="22" x2="100" y2="22" stroke="#333" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
    '<path d="' + d.trim() + '" fill="none" stroke="' + colour + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' + deaths;
  svg += '</svg>';
  // kill dots sit outside the stretched svg so they stay round
  let dots = '';
  f.kills.forEach(k => {
    if (k.kslot === p.slot) dots += '<i class="kd" style="left:' + X(k.t) + '%" title="' + esc(fmtClock(k.t)) + ' killed ' + esc(k.victim) + '"></i>';
  });
  return '<div class="hpwrap">' + svg + dots + '</div>';
}

function fightHtml(f) {
  // sizes read Axis v Allies, each number in its team's colour and the v plain
  const sizeHtml = (axis, allies) => '<span class="ax">' + axis + '</span>v<span class="al">' + allies + '</span>';
  const size = f.sides.length === 2 ? sizeHtml(f.sides[0].players.length, f.sides[1].players.length) : f.sides.map(s => s.players.length).join('v');
  const hpTxt = f.sides.length === 2 ? '<span class="nums">Start HP <span class="ax">' + f.sides[0].hp + '</span> : <span class="al">' + f.sides[1].hp + '</span></span>' : '';
  const won = f.winner ? '<span class="won-' + (f.winner === 'axis' ? 'ax' : 'al') + '">' + (f.winner === 'axis' ? 'Axis' : 'Allies') + ' won</span>' : '<span class="even">even</span>';
  const label = FIGHT_LABEL[f.classification];
  let html = '<details class="fight"><summary><span class="when">' + fmtClock(f.start_ms) + '</span><span class="size">' + size + (label ? ' ' + label : '') + '</span>' + won + hpTxt +
    '<span class="nums">' + f.kills.length + ' kill' + (f.kills.length === 1 ? '' : 's') + ' &middot; ' + f.damage + ' damage &middot; ' + Math.max(1, Math.round((f.end_ms - f.start_ms) / 1000)) + ' s</span></summary><div class="body">';
  f.sides.forEach(s => {
    html += '<div class="side ' + s.team + '"><h4>' + (s.team === 'axis' ? 'Axis' : 'Allies') + '</h4>';
    s.players.forEach(p => {
      html += '<div class="pl' + (p.died ? ' dead' : '') + '"><span class="n">' + (p.flag ? '<span class="flag" title="had the objective">&#9873;</span> ' : '') + nm(p.name) + '</span><span class="v">' + p.hp + ' start HP &middot; ' + p.dealt + ' dealt &middot; ' + p.taken + ' taken' + (p.kills ? ' &middot; ' + p.kills + ' k' : '') + '</span></div>' + hpChart(f, p, s.team);
    });
    html += '</div>';
  });
  // the fight's own feed, laid out like the game's event feed: a dot by each name for its team (red Axis, blue Allies)
  const teamOf = {};
  f.sides.forEach(s => s.players.forEach(p => { teamOf[p.slot] = s.team; }));
  const feed = [];
  f.kills.forEach(k => feed.push({ type: 'kill', t_ms: k.t, actor: k.killer, actor_team: teamOf[k.kslot], target: k.victim, target_team: teamOf[k.vslot], weapon: k.weapon }));
  (f.revives || []).forEach(r => feed.push({ type: 'revive', t_ms: r.t, actor: r.medic, actor_team: teamOf[r.rslot], target: r.revived, target_team: teamOf[r.rslot] }));
  feed.sort((x, y) => x.t_ms - y.t_ms);
  if (feed.length) html += '<ol class="feed-list fight-feed">' + feed.map(feedLine).join('') + '</ol>';
  html += '<div class="links"><a href="/paths.html?r=' + encodeURIComponent(match) + '&amp;fight=' + f.index + '" title="This fight on a loop, with the players involved, their shots and health">Watch it in 3D &rarr;</a></div></div></details>';
  return html;
}

function loadFights() {
  fetch('/api/games/' + encodeURIComponent(match) + '/fights').then(r => r.ok ? r.json() : null).then(list => {
    if (!list || !list.length) return;
    feedState.fights = list;
    if (feedState.rendered) {                     // the feed came first: show the toggle and regroup
      document.getElementById('grp-wrap').style.display = '';
      drawFeed();
    }
  }).catch(() => {});
}

function loadFeed() {
  fetch('/api/games/' + encodeURIComponent(match) + '/feed')
    .then(r => r.ok ? r.json() : [])
    .then(renderFeed)
    .catch(() => {});
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = '';
}

// 503 means the server is still starting (or has no database), a network error may pass: try a few times, but a 404
// (no stats for this game) is final.
function load(attempt) {
  if (!/^[A-Za-z0-9_-]{1,80}$/.test(match)) { showError('No game given.'); return; }
  // the games list says whether a recording (and so a play of the game) still exists
  const clipsReq = fetch('/api/replays').then(r => r.ok ? r.json() : []).then(list => {
    const g = list.find(x => x.name === match);
    clips = g && g.has_potg && g.has_rpl ? g : null;
  }).catch(() => { clips = null; });
  fetch('/api/games/' + encodeURIComponent(match) + '/stats')
    .then(r => clipsReq.then(() => r))
    .then(r => {
      if (r.status === 404) { const e = new Error('There are no stats for this game.'); e.final = true; throw e; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch(err => {
      if (!err.final && attempt < RETRY_MS.length) {
        document.getElementById('loading').textContent = 'Loading\u2026 (retrying)';
        setTimeout(() => load(attempt + 1), RETRY_MS[attempt]);
        return;
      }
      showError(err.final ? err.message : 'Failed to load stats: ' + err.message);
    });
}
load(0);
</script>

//
// WASM Game Default Configuration
//
// Filename matters: this must be named wolfconfig_mp.cfg (Q3CONFIG_CFG for
// a non-DEDICATED build - see qcommon.h) so Com_ExecuteCfg() picks it up
// automatically for a brand-new profile. It previously sat here as
// "wolfconfig.cfg" (the old single-player name) and was silently never
// loaded - in_joystick/wasmjoy.cfg's binds looked "enabled" in a Settings
// toggle but nothing ever actually worked until you manually exec'd
// controller.cfg. Once a profile's own wolfconfig_mp.cfg gets written to
// the writable homepath (any Settings Apply/Cancel triggers this), that
// copy is found ahead of this preloaded one on every later boot, so this
// only ever seeds first-time defaults - it never clobbers anything the
// player customizes afterward (bind changes included).

// Set in-game detail
seta cg_marktime "20000"
seta cg_particleDist "1024"
seta cg_coronafardist "1536"
seta cg_coronas "1"

// Enable joystick - the full button/stick bind set, aim assist tuning,
// and controller curve/lean-mod cvars are inlined below (see "Controller
// defaults"), not just this bare enable.
seta in_joystick "1"
seta in_joystickuseanalog "1"

// Widescreen video, not overridden by recommended defaults option
seta cg_fixedAspect "1"
seta r_customwidth "640"
seta r_customheight "480"
seta r_mode "3"

// Cosmetic only
seta s_khz "22"

// Load the S4NDMoD26 game content - fs_game is CVAR_INIT (command-line
// only), so this "seta" is actually a no-op for this build; left in place
// since it's harmless and matches original intent, but don't rely on it -
// confirmed live that fs_game stays "" all session regardless. This build's
// mod-specific game/cgame/ui DLLs are baked directly into main/ instead
// (see the Dockerfile's wasm build stage), which is exactly why
// controller.cfg (bundled into the *content* pak at s4ndmod26.pk3, a
// different thing from the DLLs) is inlined below rather than exec'd -
// "exec controller.cfg" depends on the fs_game overlay actually being
// active to find that path, which it never is here, so it silently never
// ran despite everything else in this file working fine.
seta fs_game "s4ndmod26"

echo "WASM game defaults loaded!"

// Controller defaults - inlined from mod/main/controller.cfg (bundled
// into s4ndmod26.pk3, unreachable via exec here - see comment above).
// This is the mod's real default: full button/stick bind set, aim assist
// tuning, controller curve, lean modifier - keep this in sync with that
// file if it ever changes.
seta in_controllerCurve   "1"
seta in_controllerLeanMod "3"
seta j_side_axis    "0"
seta j_forward_axis "1"
seta j_up_axis      "4"
seta j_side         "0.25"
seta j_forward      "-0.25"
bind PAD0_LEFTSTICK_LEFT  "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_LEFTSTICK_UP    "+forward"
bind PAD0_LEFTSTICK_DOWN  "+back"
bind PAD0_RIGHTSTICK_LEFT  "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTSTICK_UP    "+lookup"
bind PAD0_RIGHTSTICK_DOWN  "+lookdown"
// Cross/A = jump, Circle/B = crouch, Square/X = reload, Triangle/Y = scoreboard
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_X "+reload"
bind PAD0_Y "+scores"
bind PAD0_LEFTSHOULDER  "weapprev"
bind PAD0_RIGHTSHOULDER "weapnext"
bind PAD0_LEFTTRIGGER   "+speed"
bind PAD0_RIGHTTRIGGER  "+attack"
bind PAD0_LEFTSTICK_CLICK  "+sprint"
bind PAD0_DPAD_UP    "+activate"
bind PAD0_DPAD_DOWN  "+zoom"
bind PAD0_DPAD_LEFT  "+leanleft"
bind PAD0_DPAD_RIGHT "+leanright"
// Back/Select = Limbo (class/weapon select), Start/Menu = main menu
bind PAD0_BACK  "OpenLimboMenu"
bind PAD0_START "togglemenu"
// Conservative tuning - the previous defaults here (Cone 15, Slowdown
// 0.15, Pull 0.8, PullMax 8.0) were dramatically more aggressive than
// CL_InitInput's own C-side fallback values (Cone 12, Slowdown 0.72,
// Pull 0.03, PullMax 0.30 - see cl_input.c, commented there as "a
// conservative first-pass controller baseline"), and felt jerky in
// practice - an 80%-per-frame pull capped at 8 degrees/frame snaps the
// crosshair hard every time a target enters/leaves the cone. Matching
// the C-side baseline here instead of drifting from it.
seta cl_controllerAimAssist         "1"
seta cl_controllerAimAssistCone     "12"
seta cl_controllerAimAssistSlowdown "0.72"
seta cl_controllerAimAssistWindow   "500"
seta cl_controllerAimAssistPull     "0.03"
seta cl_controllerAimAssistPullMax  "0.30"
seta cl_controllerAimAssistDebug    "0"

// Execute recommended WASM video settings before the game starts and flag it
// as loaded so the video subsystem does not get restarted later
exec "wasmvid.cfg"
seta com_recommendedSet "1"

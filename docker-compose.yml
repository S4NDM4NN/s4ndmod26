services:
  rtcw-server:
    image: repo.s4ndmod.com/s4ndmod/s4ndmod26:latest
    build:
      context: .
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "27960:27960/udp"
    volumes:
      - ./gamedata/main:/rtcw/main:ro
      - ./gamedata/s4ndmod26:/rtcw/s4ndmod26
      - rtcw-omnibot-data:/rtcw/omni-bot
    restart: unless-stopped
    networks: [internal]

  web:
    image: repo.s4ndmod.com/s4ndmod/s4ndmod26-web:latest
    build:
      context: .
      target: web
      # launcher update signing key (CI sets LAUNCHER_SIGNING_KEY_FILE on main-branch builds; otherwise
      # the empty placeholder is mounted and the launcher is built without signatures)
      secrets:
        - launcher_signing_key
    environment:
      - RTCW_HOST=rtcw-server
      - RTCW_PORT=27960
      - STATUS_API_PORT=8080
      # per-game stats: the status API ingests <gamedata>/s4ndmod26/stats/*.jsonl into Postgres (unset = no stats pages)
      - DATABASE_URL=postgres://s4nd:${POSTGRES_PASSWORD:-s4nd}@postgres:5432/s4nd?sslmode=disable
      # client-demo replays (side project, see infra/web/nginx/html/demos): off unless enabled AND a key is set
      - USERDEMO_UPLOAD_ENABLED=${USERDEMO_UPLOAD_ENABLED:-0}
      - USERDEMO_UPLOAD_KEY=${USERDEMO_UPLOAD_KEY:-}
      # one "label secret" line per uploader (the label is who an upload belongs to); needs the postgres above
      - USERDEMO_KEYS_FILE=${USERDEMO_KEYS_FILE:-}
    ports:
      - "99:80"
    volumes:
      - ./gamedata/main:/usr/share/nginx/html/downloads/main:ro
      - ./gamedata/s4ndmod26:/usr/share/nginx/html/downloads/s4ndmod26:ro
      - ./gamedata/s4ndmod26/replays:/usr/share/nginx/html/downloads/s4ndmod26/replays
      # uploaded client demos (kept for good): private, not under the served downloads, apart from the server's own replays
      - ./gamedata/userdemos:/userdemos
    depends_on:
      - rtcw-server
      - postgres
    restart: unless-stopped
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=s4nd
      - POSTGRES_DB=s4nd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-s4nd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s4nd -d s4nd"]
      interval: 10s
    restart: unless-stopped
    networks: [internal]

  # WebSocket → UDP bridge so the WASM client can reach the game server.
  # Browser connects to ws://host:27960 (TCP); the bridge forwards frames to rtcw-server:27960/udp.
  # TCP 27960 and UDP 27960 are independent — native clients use UDP, WASM uses WebSocket.
  websockify:
    image: python:3.12-slim
    command: >
      sh -c "pip install websockets --quiet &&
             python /bridge/ws_udp_bridge.py --listen-host 0.0.0.0 --listen-port 27960 --target-host rtcw-server --target-port 27960"
    ports:
      - "27960:27960/tcp"
    volumes:
      - ./wasm/ws_udp_bridge.py:/bridge/ws_udp_bridge.py:ro
    depends_on:
      - rtcw-server
    restart: unless-stopped
    networks: [internal]

volumes:
  rtcw-omnibot-data:
  pgdata:

networks:
  internal:
    driver: bridge

secrets:
  launcher_signing_key:
    file: ${LAUNCHER_SIGNING_KEY_FILE:-./infra/no-signing-key}

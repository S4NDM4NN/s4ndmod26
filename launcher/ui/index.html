<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S4NDMoD26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0d100e;
    --panel: #26332c;
    --panel-hi: #3d5047;
    --panel-lo: #151c18;
    --edge: #5d7568;
    --text: #e4ece4;
    --dim: #a9b9ad;
    --red: #cf1b1f;        /* brand red: logo, title and Play button */
    --red-hi: #e8393c;
    --red-lit: #ef6a6c;
    --red-dark: #5a0b0e;
    --gold: #d6b25a;
    --term: #b9f5a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg) radial-gradient(ellipse at 50% 0%, #1b2620 0%, var(--bg) 70%);
    color: var(--text);
    font: 14px/1.4 "Segoe UI", "Segoe UI Variable Text", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; flex-direction: column; padding: 14px 16px; gap: 12px; user-select: none; overflow: hidden;
  }
  /* beveled panel, like the in-game menus */
  .panel {
    background: var(--panel);
    border: 2px solid; border-color: var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi);
    outline: 1px solid #000;
  }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 14px; }
  .logo { height: 48px; width: auto; display: block; flex: none; }
  h1 {
    margin: 0; font: 400 34px/1.05 Impact, "Arial Narrow", "Segoe UI", sans-serif; letter-spacing: 1px;
    color: var(--red); text-shadow: 2px 2px 0 #000;
  }
  h1 span { color: #fff; }
  h1 small { display: block; font: 400 14px/1.5 "Segoe UI", system-ui, sans-serif; letter-spacing: 0; color: var(--dim); text-shadow: none; }
  .ver { margin-left: auto; text-align: right; font: 13px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--dim); }
  .ver b { color: var(--gold); font-weight: 600; }

  main { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #console {
    flex: 1; min-height: 0; background: #050705; color: var(--term); padding: 8px 10px;
    font: 13px/1.55 Consolas, "Cascadia Mono", "Cascadia Code", "DejaVu Sans Mono", Menlo, monospace;
    overflow-y: auto; user-select: text;
    border: 2px solid; border-color: var(--panel-lo) var(--panel-hi) var(--panel-hi) var(--panel-lo);
  }
  #console .w { color: #f0cf7a; } #console .e { color: #ff8a7d; } #console .d { color: #86a083; }
  #console::-webkit-scrollbar { width: 10px; } #console::-webkit-scrollbar-thumb { background: var(--edge); }

  .status { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
  .prog { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .prog .status { font-size: 14px; gap: 10px; }
  .prog .bar { height: 16px; padding: 2px; }
  #msg { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cur { color: var(--dim); font: 13px Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; max-width: 50%; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* blocky progress bar */
  .bar { height: 22px; background: #050705; border: 2px solid; border-color: var(--panel-lo) var(--panel-hi) var(--panel-hi) var(--panel-lo); padding: 2px; }
  #fill {
    height: 100%; width: 0%; transition: width .12s linear;
    background: repeating-linear-gradient(90deg, var(--red) 0 10px, #7e0f14 10px 12px);
  }
  .bar.idle #fill { background: repeating-linear-gradient(90deg, var(--edge) 0 10px, #33453b 10px 12px); }
  .bar.spin #fill { width: 28% !important; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 72% } }

  footer { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  button {
    font: 600 14px "Segoe UI", system-ui, sans-serif; color: var(--text);
    background: var(--panel-hi); padding: 8px 12px; cursor: pointer; outline: 1px solid #000; white-space: nowrap;
    border: 2px solid; border-color: #6f8a7b #1a231e #1a231e #6f8a7b;
  }
  button:hover:not(:disabled) { background: #4a6156; }
  button:active:not(:disabled) { border-color: #1a231e #6f8a7b #6f8a7b #1a231e; }
  button:disabled { opacity: .45; cursor: default; }
  #play {
    margin-left: 0; font: 400 24px Impact, "Arial Narrow", "Segoe UI", sans-serif; letter-spacing: 2px; padding: 6px 40px;
    background: var(--red); color: #fff; text-shadow: 1px 1px 0 #000; border-color: var(--red-lit) var(--red-dark) var(--red-dark) var(--red-lit);
  }
  #play:hover:not(:disabled) { background: var(--red-hi); }
  #play.long { font-size: 20px; padding: 7px 26px; }
  #play.launcher { background: var(--gold); color: #1b1608; text-shadow: none; border-color: #f0d68a #7a6320 #7a6320 #f0d68a; }
  #play.launcher:hover:not(:disabled) { background: #e6c872; }
  #msg.notice { color: var(--gold); }
  .path { color: var(--dim); font: 12px Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .form { display: none; padding: 10px 12px; gap: 8px; flex-direction: column; }
  .form.open { display: flex; }
  /* settings float over the page (dimmed behind) rather than squeezing the console */
  #settings.open { position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); z-index: 4; box-shadow: 0 0 0 100vmax rgba(0,0,0,.66); }
  .form label { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
  .form input {
    background: #050705; color: var(--term); font: 13px Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; padding: 6px 8px; user-select: text;
    border: 2px solid; border-color: var(--panel-lo) var(--panel-hi) var(--panel-hi) var(--panel-lo);
  }
  .form .row { display: flex; gap: 8px; justify-content: flex-end; }
  /* icon buttons: gear in the header, folder next to the path */
  .ibtn { padding: 6px; width: 36px; height: 34px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .ibtn svg { width: 20px; height: 20px; fill: currentColor; }
  header .ibtn { align-self: flex-start; margin-top: -2px; }
  .where { display: flex; align-items: center; gap: 10px; margin-top: -2px; }
  #dir { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
         color: var(--term); font: 15px Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; user-select: text; }
  /* a small, plain upgrade button beside Play */
  #upgrade { background: transparent; color: var(--gold); border-color: #7a6320; outline-color: transparent; font-weight: 600; }
  #upgrade:hover:not(:disabled) { background: #2d2a17; color: #f0d68a; }
  #s-note { color: #ff8a7d; font-size: 13px; }
  .form .tools { display: flex; gap: 8px; }

  /* dialog */
  #dlg { position: fixed; inset: 0; background: rgba(0,0,0,.66); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  #dlg.open { display: flex; }
  #dlg .box { width: 100%; max-width: 640px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  #dlg h2 { margin: 0; font: 400 26px/1.1 Impact, "Arial Narrow", "Segoe UI", sans-serif; letter-spacing: 1px; color: var(--gold); }
  #dlg p { margin: 0 0 8px; color: var(--text); font-size: 14px; line-height: 1.5; user-select: text; }
  #dlg .row { display: flex; gap: 8px; justify-content: flex-end; }
  #dlg .term { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #050705; color: var(--term);
    border: 2px solid; border-color: var(--panel-lo) var(--panel-hi) var(--panel-hi) var(--panel-lo);
    font: 17px/1.3 Consolas, "Cascadia Mono", "Cascadia Code", "DejaVu Sans Mono", Menlo, monospace; }
  #dlg .term b { color: var(--gold); font-weight: 400; }
  #dlg .term input { flex: 1; min-width: 0; padding: 10px 0; border: 0; outline: 0; background: transparent; color: var(--term); font: inherit; user-select: text; }
  #dlg .term input::placeholder { color: #5f7a5c; }
  .hide { display: none !important; }
</style>
</head>
<body>
<header class="panel">
  <img class="logo" id="logo" alt="S4NDMoD26" width="135" height="48">
  <h1>S4NDMoD<span>26</span><small>A Return to Castle Wolfenstein mod</small></h1>
  <div class="ver">launcher <span id="lver">–</span><br>build <b id="ver">–</b></div>
  <button id="gear" class="ibtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.07.63-.07.94s.03.63.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
</header>

<main>
  <div id="console" class="panel" aria-live="polite"></div>
  <div class="where">
    <button id="folder" class="ibtn" title="Open folder" aria-label="Open folder"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg></button>
    <span id="dir"></span>
  </div>
</main>

<div id="settings" class="panel form">
  <label>Server <input id="s-server" spellcheck="false"></label>
  <label>Install folder <input id="s-dir" spellcheck="false"></label>
  <label>Connect to <input id="s-connect" spellcheck="false" placeholder="(same as server)"></label>
  <div id="s-note"></div>
  <div class="row">
    <span class="tools"><button id="verify">Verify files</button><button id="revert" class="hide">Revert to Demo Mode</button></span>
    <span style="flex:1"></span>
    <button id="s-cancel">Cancel</button><button id="s-save">Save &amp; check</button>
  </div>
</div>

<footer class="panel">
  <div class="prog">
    <div class="status"><span id="msg">Starting…</span><span id="cur"></span></div>
    <div class="bar idle spin" id="bar"><div id="fill"></div></div>
  </div>
  <button id="upgrade" class="hide">Use Retail Game Files</button>
  <button id="play" disabled>Play</button>
</footer>

<div id="dlg"><div class="panel box">
  <h2 id="d-title"></h2>
  <div id="d-text"></div>
  <div id="d-path" class="term"><b>&gt;</b><input id="d-dir" spellcheck="false" placeholder="RTCW folder"></div>
  <div class="row"><button id="d-browse">Browse</button><span style="flex:1"></span><button id="d-cancel">Cancel</button><button id="d-go"></button></div>
</div></div>

<script>
(function () {
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('console');

  function log(text, cls) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    logEl.appendChild(d);
    while (logEl.childNodes.length > 400) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function api(path, body) {
    return fetch(path, {
      method: 'POST', headers: { 'X-Token': token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        if (!r.ok) throw new Error(t || r.status);
        try { return t ? JSON.parse(t) : null; } catch (e) { return null; }
      });
    });
  }
  function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }

  var drawn = 0;
  document.getElementById('logo').src = '/logo.svg?t=' + encodeURIComponent(token);
  var settingsLoaded = false;
  var phase = '', snap = {};

  function render(s) {
    snap = s;
    $('msg').textContent = s.message || '';
    $('ver').textContent = s.version || '–';
    $('lver').textContent = s.launcher || '–';
    $('dir').textContent = s.dir ? '‎' + s.dir : '';
    $('dir').title = s.dir || '';
    $('s-note').textContent = s.note || '';

    var bar = $('bar'), fill = $('fill');
    var busy = s.phase === 'checking' || s.phase === 'launching';
    bar.classList.toggle('spin', busy);
    bar.classList.toggle('idle', s.phase !== 'updating' && s.phase !== 'error');
    if (s.phase === 'updating') {
      var pct = s.bytesTotal ? Math.min(100, s.bytesDone * 100 / s.bytesTotal) : 0;
      fill.style.width = pct + '%';
      $('cur').textContent = s.current ? s.current + '  ' + mb(s.bytesDone) + ' / ' + mb(s.bytesTotal) : '';
    } else {
      fill.style.width = (s.phase === 'ready' || s.phase === 'needs_update') ? '100%' : fill.style.width;
      $('cur').textContent = '';
    }

    // The main button is the one action that is needed: Install or Update (then Play once that is done), or
    // Update launcher, which replaces Play until the launcher is current.
    phase = s.phase;
    var play = $('play');
    var label = 'Play', enabled = false, cls = '';
    if (s.phase === 'ready') { enabled = true; }
    else if (s.phase === 'needs_update') { label = s.installed ? 'Update' : 'Install'; enabled = true; }
    else if (s.phase === 'launcher_update') { label = 'Update launcher'; enabled = true; cls = 'long launcher'; }
    else if (s.phase === 'launching') { label = 'Starting…'; }
    else if (s.phase === 'updating') { label = 'Downloading…'; cls = 'long'; }
    play.textContent = label; play.className = cls; play.disabled = !enabled;
    var bad = s.retailBad && s.retailBad.length;
    $('msg').className = (bad || s.phase === 'launcher_update' || s.phase === 'needs_update' || s.phase === 'setup') ? 'notice' : '';
    if (bad && s.phase === 'ready') $('msg').textContent = 'Some retail files are damaged.';
    if (s.phase === 'needs_update') { $('cur').textContent = mb(s.bytesTotal); }
    var idle = s.phase === 'checking' || s.phase === 'updating' || s.phase === 'launching' || s.phase === 'setup';
    $('verify').disabled = idle;

    // demo mode offers the upgrade; damaged retail files offer a repair; both only when nothing else is pending
    var up = $('upgrade');
    up.classList.toggle('hide', !(s.installed && s.phase === 'ready' && (!s.retail || bad)));
    up.textContent = bad ? 'Repair Retail Files' : 'Use Retail Game Files';
    $('revert').classList.toggle('hide', !s.retail);
    $('revert').disabled = idle;

    // first run: nothing happens until the install folder is confirmed
    var setup = s.phase === 'setup';
    if (setup && !$('settings').classList.contains('open')) { $('settings').classList.add('open'); }
    $('s-save').textContent = setup ? 'Use this folder' : 'Save & check';
    $('s-cancel').classList.toggle('hide', setup);
    $('gear').disabled = setup;

    // console: the server keeps the log; append whatever this page has not drawn yet
    var lg = s.log || [];
    if (lg.length < drawn) { logEl.textContent = ''; drawn = 0; }
    for (; drawn < lg.length; drawn++) log(lg[drawn].text, lg[drawn].cls);

    if (!settingsLoaded || !$('settings').classList.contains('open')) {
      $('s-server').value = s.server || '';
      $('s-dir').value = s.dir || '';
      $('s-connect').value = s.connect === hostOf(s.server) ? '' : (s.connect || '');
      settingsLoaded = true;
    }
  }
  function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return ''; } }
  function fail(e) { log(String(e.message || e), 'e'); }

  var es = new EventSource('/api/events?t=' + encodeURIComponent(token));
  es.onmessage = function (e) { render(JSON.parse(e.data)); };
  es.onerror = function () { /* the app closes this stream when it exits */ };

  $('play').onclick = function () {
    var path = phase === 'launcher_update' ? '/api/update-launcher' : phase === 'needs_update' ? '/api/update' : '/api/play';
    api(path).catch(fail);
  };
  $('verify').onclick = function () { $('settings').classList.remove('open'); api('/api/recheck'); };
  $('folder').onclick = function () { api('/api/openfolder'); };
  $('gear').onclick = function () { $('settings').classList.toggle('open'); };
  $('s-cancel').onclick = function () { $('settings').classList.remove('open'); };
  $('s-save').onclick = function () {
    api('/api/settings', { server: $('s-server').value, dir: $('s-dir').value, connect: $('s-connect').value })
      .then(function () { $('settings').classList.remove('open'); })
      .catch(function (e) { $('s-note').textContent = String(e.message || e); });
  };

  // ---- dialogs: upgrade to retail (or repair), and revert to demo
  var mode = '';
  function setDir(v) { var i = $('d-dir'); i.value = v; i.scrollLeft = i.scrollWidth; $('d-go').disabled = !v.trim(); }
  function para(t) { var p = document.createElement('p'); p.textContent = t; return p; }
  function openDialog(m) {
    mode = m;
    var t = $('d-text'); t.textContent = '';
    var bad = snap.retailBad && snap.retailBad.length;
    $('settings').classList.remove('open');
    if (m === 'upgrade') {
      $('d-title').textContent = bad ? 'Repair Retail Files' : 'Upgrade to Full Game';
      if (bad) {
        t.appendChild(para('These retail files are damaged: ' + snap.retailBad.join(', ') + '.'));
        t.appendChild(para('Point this launcher to your Return to Castle Wolfenstein folder and it will replace them. Your original installation will not be modified.'));
      } else {
        t.appendChild(para('You’re currently playing in Demo Mode, which only supports the demo maps.'));
        t.appendChild(para('If you own the retail version of Return to Castle Wolfenstein, you can point this launcher to your existing game files to unlock support for all retail and compatible community maps.'));
        t.appendChild(para('Your original retail installation will not be modified.'));
      }
      $('d-path').classList.remove('hide'); $('d-browse').classList.remove('hide');
      $('d-go').textContent = 'Copy files'; $('d-go').classList.remove('hide');
      setDir($('d-dir').value);
      api('/api/retail/find').then(function (r) { if (r && r.folders && r.folders.length && !$('d-dir').value) setDir(r.folders[0]); }).catch(function () {});
    } else {
      $('d-title').textContent = 'Revert to Demo Mode';
      if (snap.canRevert) {
        t.appendChild(para('This removes only the retail files this launcher copied into your game folder. Your original RTCW installation, your own files and your settings are not touched.'));
        t.appendChild(para('The demo files come back when you press Install.'));
        $('d-go').textContent = 'Revert'; $('d-go').classList.remove('hide'); $('d-go').disabled = false;
      } else {
        t.appendChild(para('Nothing to revert: this launcher has no record of importing files into this folder, so it will not remove any.'));
        $('d-go').classList.add('hide');
      }
      $('d-path').classList.add('hide'); $('d-browse').classList.add('hide');
    }
    $('dlg').classList.add('open');
  }
  function closeDialog() { $('dlg').classList.remove('open'); }
  $('upgrade').onclick = function () { openDialog('upgrade'); };
  $('revert').onclick = function () { openDialog('revert'); };
  $('d-cancel').onclick = closeDialog;
  $('d-dir').oninput = function () { $('d-go').disabled = !$('d-dir').value.trim(); };
  $('d-browse').onclick = function () {
    api('/api/retail/browse').then(function (r) { if (r && r.folder) setDir(r.folder); }).catch(fail);
  };
  $('d-go').onclick = function () {
    var p = mode === 'upgrade' ? api('/api/retail/import', { dir: $('d-dir').value }) : api('/api/retail/demo');
    closeDialog();
    p.catch(fail);
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDialog(); });
})();
</script>
</body>
</html>

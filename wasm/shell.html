<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>S4NDMoD26 — Play in Browser</title>
    <style>
      body {
        background-color: black;
        color: rgb(224,224,224);
        font-family: Arial,Helvetica,sans-serif;
        font-size: 16px;
        margin: 0px;
        min-height: 100vh;
        overflow: hidden;
      }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten {
        font-family: monospace;
        font-size: 14px;
        width: calc(100% - 24px);
        height: calc(100vh - 24px);
        margin-top: 8px;
        background-color: inherit;
        color: rgb(192, 192, 192);
        border: 1px solid rgb(64, 64, 64);
        resize: none;
        display: none;
        outline: none;
      }
      div.emscripten { text-align: center; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background-color: inherit;
        display: none;
        outline: none;
        width: min(100vw, calc(100vh * 4 / 3));
        height: auto;
        max-width: 100vw;
        max-height: 100vh;
      }
      /* While truly fullscreen (see _attemptPointerLock(), which
         fullscreens documentElement), fill the whole screen instead of
         keeping the windowed view's 4:3-capped box - otherwise a
         non-4:3 monitor sees black bars down the sides even in
         fullscreen. The renderer's internal resolution doesn't track
         this (vid_restart is a no-op on this build), so the rendered
         frame gets stretched to fill rather than truly re-rendered at
         the new aspect - trading a little distortion for no bars. */
      html:fullscreen canvas.emscripten,
      html:-webkit-full-screen canvas.emscripten,
      html:-moz-full-screen canvas.emscripten {
        width: 100vw;
        height: 100vh;
      }

      .spinner {
        height: 50px;
        width: 50px;
        margin: 0px auto;
        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border-left: 10px solid rgb(64,64,128);
        border-right: 10px solid rgb(64,64,128);
        border-bottom: 10px solid rgb(64,64,128);
        border-top: 10px solid rgb(192,192,192);
        border-radius: 100%;
        background-color: inherit;
      }
      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

      #settingsGear {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgb(96, 96, 96);
        background-color: rgba(0, 0, 0, 0.55);
        color: rgb(224, 224, 224);
        font-size: 20px;
        line-height: 40px;
        text-align: center;
        cursor: pointer;
        z-index: 100;
        display: none;
      }
      #settingsGear:hover { background-color: rgba(48, 48, 48, 0.75); }

      #settingsPanel {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: rgba(0, 0, 0, 0.75);
        z-index: 101;
        display: none;
        align-items: center;
        justify-content: center;
      }
      #settingsPanel.open { display: flex; }
      #settingsPanelBox {
        background-color: rgb(24, 24, 24);
        border: 1px solid rgb(96, 96, 96);
        border-radius: 6px;
        padding: 20px 24px;
        width: 360px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 32px);
        overflow-y: auto;
      }
      #settingsPanelBox h2 {
        margin: 0 0 4px 0;
        font-size: 18px;
        color: rgb(224, 224, 224);
      }
      #settingsPanelBox p.settingsNote {
        margin: 0 0 16px 0;
        font-size: 12px;
        color: rgb(160, 160, 160);
      }
      #settingsPanelBox label {
        display: block;
        margin-top: 14px;
        margin-bottom: 4px;
        font-size: 13px;
        color: rgb(200, 200, 200);
      }
      #settingsPanelBox select,
      #settingsPanelBox input[type=number],
      #settingsPanelBox input[type=range] {
        width: 100%;
        box-sizing: border-box;
        background-color: rgb(40, 40, 40);
        color: rgb(224, 224, 224);
        border: 1px solid rgb(96, 96, 96);
        border-radius: 3px;
        padding: 5px;
        font-family: inherit;
        font-size: 13px;
      }
      #settingsCustomRes {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      #settingsCustomRes input { width: 100%; }
      #settingsCustomRes.hidden { display: none; }

      .settingsTabs {
        display: flex;
        gap: 2px;
        margin-top: 12px;
        border-bottom: 1px solid rgb(64, 64, 64);
      }
      .settingsTabBtn {
        flex: 1;
        background: none;
        border: none;
        color: rgb(160, 160, 160);
        padding: 8px 4px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .settingsTabBtn:hover { color: rgb(200, 200, 200); }
      .settingsTabBtn.active { color: rgb(224, 224, 224); border-bottom-color: rgb(96, 128, 192); }
      .settingsTabPanel.hidden { display: none; }
      #settingsPanelBox label.settingsFieldLabel {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .settingsRestartTag {
        color: rgb(160, 128, 96);
        font-size: 11px;
        white-space: nowrap;
        margin-left: 6px;
        margin-right: 6px;
      }
      .settingsBoolRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
      }
      #settingsPanelBox .settingsBoolRow label { margin: 0; }
      .settingsBoolRow input[type=checkbox] { width: 18px; height: 18px; }
      #settingsPanelBox .settingsButtons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 22px;
      }
      #settingsPanelBox button {
        background-color: rgb(48, 48, 48);
        color: rgb(224, 224, 224);
        border: 1px solid rgb(96, 96, 96);
        border-radius: 3px;
        padding: 7px 14px;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #settingsPanelBox button:hover { background-color: rgb(72, 72, 72); }
      #settingsPanelBox button#settingsApply {
        background-color: rgb(64, 96, 160);
        border-color: rgb(96, 128, 192);
      }
      #settingsPanelBox button#settingsApply:hover { background-color: rgb(80, 112, 176); }

    </style>
  </head>
  <body>
    <figure style="overflow:visible;" id="spinner"><div class="spinner"></div><center style="margin-top:0.5em"><strong>S4NDMoD26</strong></center></figure>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>
    <textarea class="emscripten" id="output" readonly></textarea>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <a id="exportFile" hidden=1></a>

    <button id="settingsGear" title="Settings">&#9881;</button>
    <div id="settingsPanel">
      <div id="settingsPanelBox">
        <h2>Settings</h2>
        <p class="settingsNote">Most changes apply immediately. Anything marked <span class="settingsRestartTag">restart required</span> needs Apply &amp; Reload to take effect.</p>

        <div class="settingsTabs">
          <button class="settingsTabBtn active" data-tab="display">Display</button>
          <button class="settingsTabBtn" data-tab="audio">Audio</button>
          <button class="settingsTabBtn" data-tab="gameplay">Gameplay</button>
        </div>

        <div class="settingsTabPanel" data-tab="display" id="settingsTab_display">
          <label for="settingsResolution">Resolution <span class="settingsRestartTag">restart required</span></label>
          <select id="settingsResolution"></select>
          <div id="settingsCustomRes" class="hidden">
            <input type="number" id="settingsCustomWidth" min="320" max="7680" step="1" placeholder="Width">
            <input type="number" id="settingsCustomHeight" min="240" max="4320" step="1" placeholder="Height">
          </div>
        </div>
        <div class="settingsTabPanel hidden" data-tab="audio" id="settingsTab_audio"></div>
        <div class="settingsTabPanel hidden" data-tab="gameplay" id="settingsTab_gameplay"></div>

        <div class="settingsButtons">
          <button id="settingsCancel">Cancel</button>
          <button id="settingsApply">Apply &amp; Reload</button>
        </div>
      </div>
    </div>

    <script type='text/javascript'>
      // Emscripten's UDP-over-WebSocket emulation only creates a fresh
      // connection when the previous one's readyState is CLOSING/CLOSED -
      // if a handshake stalls in CONNECTING (e.g. a mobile network blip)
      // without ever erroring out, every send just silently queues onto
      // the dead socket forever and the client never reconnects. Wrap
      // WebSocket construction so a stuck-CONNECTING socket gets force-
      // closed after a timeout, which lets Emscripten's own reconnect
      // logic kick in on the next send.
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        var STALL_TIMEOUT_MS = 5000;

        function WatchdogWebSocket(url, protocols) {
          var ws = (protocols !== undefined)
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);

          var timer = setTimeout(function() {
            if (ws.readyState === NativeWebSocket.CONNECTING) {
              console.warn('WebSocket stuck CONNECTING for', STALL_TIMEOUT_MS, 'ms, forcing close to allow reconnect:', url);
              try { ws.close(); } catch (e) {}
            }
          }, STALL_TIMEOUT_MS);

          var clearWatchdog = function() { clearTimeout(timer); };
          ws.addEventListener('open', clearWatchdog);
          ws.addEventListener('close', clearWatchdog);
          ws.addEventListener('error', clearWatchdog);

          return ws;
        }

        WatchdogWebSocket.prototype = NativeWebSocket.prototype;
        WatchdogWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        WatchdogWebSocket.OPEN = NativeWebSocket.OPEN;
        WatchdogWebSocket.CLOSING = NativeWebSocket.CLOSING;
        WatchdogWebSocket.CLOSED = NativeWebSocket.CLOSED;

        window.WebSocket = WatchdogWebSocket;
      })();

      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      var exportElement = document.getElementById('exportFile');
      var settingsGearElement = document.getElementById('settingsGear');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // Pop up an alert when webgl context is lost
      canvasElement.addEventListener("webglcontextlost", (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      // Chromium won't let a page suppress reserved shortcuts (Ctrl+W and
      // friends) via keydown preventDefault, but it will via the Keyboard
      // Lock API while in fullscreen - request lock as soon as we enter
      // fullscreen (Escape always remains available to exit, per spec).
      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement && navigator.keyboard && navigator.keyboard.lock) {
          navigator.keyboard.lock().catch((e) => console.warn('Keyboard Lock failed:', e));
        }
      });

      // Firefox/Safari (no Keyboard Lock) and Chrome sessions not in
      // fullscreen fall back to the browser's native "leave site?" prompt
      // while a game is actively in progress.
      window.addEventListener('beforeunload', (e) => {
        if (Module._connected) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // Settings overlay. The overlay's own source of truth is localStorage,
      // not the engine's config file - this avoids any read/write race with
      // the C engine's own (throttled) config writer, at the cost of not
      // reflecting settings changed via the in-game console/menu until
      // re-saved here. Fields with live:true are also pushed to the running
      // engine immediately via wasm_set_cvar (see the settings IIFE below);
      // fields with live:false are CVAR_LATCH and only take effect through
      // Apply & Reload, same as resolution.
      var SETTINGS_KEY = 's4ndmod26.settings.v1';
      // A curated subset of the engine's r_vidModes[] (code/renderer/tr_init.c)
      var SETTINGS_RES_MODES = [
        { mode: 3,  label: '640 x 480' },
        { mode: 4,  label: '800 x 600' },
        { mode: 6,  label: '1024 x 768 (default)' },
        { mode: 18, label: '1280 x 720' },
        { mode: 8,  label: '1280 x 1024' },
        { mode: 23, label: '1600 x 900' },
        { mode: 26, label: '1920 x 1080' },
        { mode: 29, label: '2560 x 1600' },
        { mode: -1, label: 'Custom...' }
      ];
      var SETTINGS_FIELDS = [
        // Display
        { id: 'sensitivity', tab: 'display', cvar: 'sensitivity', label: 'Mouse Sensitivity', type: 'range', min: 1, max: 30, step: 0.5, def: 5, live: true },
        { id: 'fov', tab: 'display', cvar: 'cg_fov', label: 'Field of View', type: 'range', min: 80, max: 130, step: 1, def: 90, live: true },
        { id: 'brightness', tab: 'display', cvar: 'r_gamma', label: 'Brightness', type: 'range', min: 0.5, max: 3, step: 0.1, def: 2.2, live: true },
        { id: 'geoDetail', tab: 'display', cvar: 'r_lodbias', label: 'Geometric Detail', type: 'select', options: [[0, 'High'], [1, 'Medium'], [2, 'Low']], def: 0, live: true },
        { id: 'shadows', tab: 'display', cvar: 'cg_shadows', label: 'Shadows', type: 'select', options: [[0, 'Off'], [1, 'Blob'], [3, 'Projected']], def: 1, live: true },
        { id: 'dynamicLights', tab: 'display', cvar: 'r_dynamiclight', label: 'Dynamic Lights', type: 'bool', def: 1, live: true },
        { id: 'texQuality', tab: 'display', cvar: 'r_picmip', label: 'Texture Quality', type: 'select', options: [[0, 'High'], [1, 'Normal'], [2, 'Low']], def: 1, live: false },
        { id: 'lighting', tab: 'display', cvar: 'r_vertexLight', label: 'Lighting', type: 'select', options: [[0, 'Lightmap (High)'], [1, 'Vertex (Low)']], def: 0, live: false },
        { id: 'vsync', tab: 'display', cvar: 'r_swapInterval', label: 'VSync', type: 'bool', def: 0, live: false },
        // Audio
        { id: 'volume', tab: 'audio', cvar: 's_volume', label: 'Effects Volume', type: 'range', min: 0, max: 1, step: 0.05, def: 0.8, live: true },
        { id: 'musicVolume', tab: 'audio', cvar: 's_musicvolume', label: 'Music Volume', type: 'range', min: 0, max: 1, step: 0.05, def: 0.25, live: true },
        { id: 'muteUnfocused', tab: 'audio', cvar: 's_muteWhenUnfocused', label: 'Mute When Unfocused', type: 'bool', def: 0, live: true },
        { id: 'muteMinimized', tab: 'audio', cvar: 's_muteWhenMinimized', label: 'Mute When Minimized', type: 'bool', def: 0, live: true },
        // Gameplay
        { id: 'autoSwitch', tab: 'gameplay', cvar: 'cg_autoswitch', label: 'Auto-Switch Weapons', type: 'select', options: [[0, 'Off'], [1, 'Always'], [2, 'If New'], [3, 'If Better'], [4, 'New or Better']], def: 2, live: true },
        { id: 'autoReload', tab: 'gameplay', cvar: 'cg_autoReload', label: 'Auto Reload', type: 'bool', def: 1, live: true },
        { id: 'drawGun', tab: 'gameplay', cvar: 'cg_drawGun', label: 'Draw Weapon', type: 'bool', def: 1, live: true },
        { id: 'crosshairSize', tab: 'gameplay', cvar: 'cg_crosshairSize', label: 'Crosshair Size', type: 'select', options: [[24, 'Tiny'], [32, 'Small'], [48, 'Medium'], [64, 'Large'], [96, 'Huge']], def: 48, live: true },
        { id: 'crosshairHealth', tab: 'gameplay', cvar: 'cg_crosshairHealth', label: 'Health-Colored Crosshair', type: 'bool', def: 0, live: true },
        { id: 'crosshairPulse', tab: 'gameplay', cvar: 'cg_crosshairPulse', label: 'Crosshair Pulse', type: 'bool', def: 1, live: true },
        { id: 'hudAlpha', tab: 'gameplay', cvar: 'cg_hudAlpha', label: 'HUD Opacity', type: 'range', min: 0.2, max: 1, step: 0.05, def: 1, live: true },
        { id: 'drawCompass', tab: 'gameplay', cvar: 'cg_drawCompass', label: 'Draw Compass', type: 'bool', def: 1, live: true }
      ];
      var SETTINGS_DEFAULTS = { rMode: 6, customWidth: 1600, customHeight: 1024 };
      SETTINGS_FIELDS.forEach((f) => { SETTINGS_DEFAULTS[f.id] = f.def; });

      function readOverlaySettings() {
        try {
          var raw = localStorage.getItem(SETTINGS_KEY);
          var saved = raw ? JSON.parse(raw) : {};
          return Object.assign({}, SETTINGS_DEFAULTS, saved);
        } catch (e) {
          return Object.assign({}, SETTINGS_DEFAULTS);
        }
      }

      function overlayArgv(settings) {
        var argv = [];
        function push(command, cvar, val) {
          if (val !== undefined && val !== null) argv.push(command, cvar, String(val));
        }
        // Every field cvar here is CVAR_ARCHIVE, most read well after boot
        // (some not until cgame loads a map), so late-executing '+seta' -
        // handled by Com_AddStartupCommands(), which only runs after
        // CL_Init() - is fine, and '+seta' guarantees CVAR_ARCHIVE
        // immediately even if the owning subsystem never loads this session.
        SETTINGS_FIELDS.forEach((f) => push('+seta', f.cvar, settings[f.id]));
        // r_mode/r_customwidth/r_customheight are CVAR_LATCH and get read by
        // GLimp_Init() inside CL_Init(), which runs BEFORE the '+seta' queue
        // is processed - by then the LATCH flag is already attached and the
        // value would just be deferred ("will be changed upon restarting")
        // instead of applying. '+set' is instead handled by the earlier
        // Com_StartupVariable(NULL) call (before CL_Init()), so the value is
        // live before the renderer ever reads it. The renderer's own
        // Cvar_Get() still ORs in CVAR_ARCHIVE afterwards, so this remains
        // persistable.
        push('+set', 'r_mode', settings.rMode);
        if (settings.rMode === -1) {
          push('+set', 'r_customwidth', settings.customWidth);
          push('+set', 'r_customheight', settings.customHeight);
        }
        return argv;
      }

      var _urlParams = new URLSearchParams(window.location.search);
      var Module = {
        _canLockPointer: true,
        _connected: false,
        _debug: _urlParams.has('debug') && _urlParams.get('debug') !== '0',
        setConnected(connected) {
          Module._connected = !!connected;
        },
        websocket: {
          // Route all browser sockets through the public WebSocket endpoint
          // instead of deriving ws://host:port from the game server address.
          url: (() => {
            if (window.location.protocol === 'https:') {
              return 'wss://' + window.location.host + '/ws';
            }
            return 'ws://' + window.location.hostname + ':27960';
          })()
        },
        print(...args) {
          console.log(...args);
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus(text) {
          Module.setStatus.last ??= { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        hideConsole() {
          Module._consoleVisible = false;
          spinnerElement.style.display = 'none';
          statusElement.style.display = 'none';
          progressElement.style.display = 'none';
          outputElement.style.display = 'none';
          canvasElement.style.display = 'block';
          canvasElement.focus();
          settingsGearElement.style.display = 'block';
        },
        showConsole() {
          Module._consoleVisible = true;
          canvasElement.style.display = 'none';
          outputElement.style.display = 'block';
          outputElement.scrollTop = outputElement.scrollHeight;
          outputElement.focus();
          settingsGearElement.style.display = 'none';
        },
        exportFile(filePath) {
          try {
            if (Module._debug) console.info('Exporting:', filePath);
            const filePathSplit = filePath.split('/');
            const dataArray = new Uint8Array(FS.readFile(filePath));
            const dataBlob = new Blob([dataArray], {type: 'application/octet-stream'});
            const objURL = URL.createObjectURL(dataBlob);
            exportElement.href = objURL;
            exportElement.download = filePathSplit[filePathSplit.length - 1];
            exportElement.click();
            URL.revokeObjectURL(objURL);
          } catch (error) {
            console.error('Error exporting file:', error);
          }
        },
        winResized() {
          if (Module._debug) console.info('Detected window resize: ' + canvasElement.width + 'x' + canvasElement.height);
        },
        captureMouse() {
          if (Module._settingsOpen) return;
          if (Module._canLockPointer && !Module._attemptPointerLock()) {
            Module._canLockPointer = false;
            if (Module._debug) console.info('Delayed pointer lock requested.');
            document.addEventListener('keydown', Module._lockPointerOnKey);
          }
        },
        _attemptPointerLock() {
          if (Module._settingsOpen) return false;
          if (document.pointerLockElement === null) {
            const p = canvasElement.requestPointerLock();
            if (p && p.catch) p.catch(() => {});
          }
          // Also request fullscreen, which lets us request Keyboard Lock
          // (see fullscreenchange listener below) so Chromium browsers stop
          // treating combos like Ctrl+W as "close tab" while playing.
          // Fullscreening documentElement (not the canvas) rather than the
          // canvas itself means the settings gear/panel - DOM siblings of
          // the canvas - stay part of the fullscreen top-layer subtree and
          // remain visible/clickable, so opening settings never needs to
          // exit fullscreen. That matters beyond just visibility: toggling
          // real fullscreen resizes the canvas element, which fires
          // SDL_WINDOWEVENT_RESIZED and schedules a vid_restart - but
          // vid_restart is a deliberate no-op on this WASM build (see
          // CL_Vid_Restart_f), so the renderer's internal viewport never
          // actually catches up and the game visibly shifts/misaligns
          // without truly resizing. Not toggling fullscreen at all avoids
          // triggering that mismatch in the first place.
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            const fs = document.documentElement.requestFullscreen();
            if (fs && fs.catch) fs.catch(() => {});
          }
          return document.pointerLockElement !== null;
        },
        _lockPointerOnKey(event) {
          if (Module._settingsOpen) return;
          if ((event.key === 'Escape') || Module._attemptPointerLock()) {
            document.removeEventListener('keydown', Module._lockPointerOnKey);
            if (Module._debug) console.info('Delayed pointer lock complete.');
            Module._canLockPointer = true;
          }
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        },
        onRuntimeInitialized() {
          if (Module._consoleVisible) {
            outputElement.style.display = 'block';
            canvasElement.style.display = 'none';
          } else {
            outputElement.style.display = 'none';
            canvasElement.style.display = 'block';
          }
        },
        arguments: (window.location.search.length > 1
          ? window.location.search.substr(1).split('&').filter((t) => !/^debug(=|$)/.test(t))
          : []).concat(overlayArgv(readOverlaySettings())).concat(['+seta', 'cg_viewsize', '100'])
      };
      Module._consoleVisible = true;
      Module.setStatus('Downloading...');
      window.onerror = () => {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };

      // Settings overlay UI wiring - independent of the game's own
      // console/menu state, toggled purely via the gear icon.
      (function() {
        var panelElement = document.getElementById('settingsPanel');
        var resolutionElement = document.getElementById('settingsResolution');
        var customResElement = document.getElementById('settingsCustomRes');
        var customWidthElement = document.getElementById('settingsCustomWidth');
        var customHeightElement = document.getElementById('settingsCustomHeight');

        // Belt-and-suspenders: while the panel is open, stop every mouse/
        // keyboard event from ever reaching the canvas (and whatever
        // Emscripten/SDL listeners it has attached), regardless of what's
        // requesting or re-requesting pointer lock. Capture-phase + window
        // guarantees we see events before the canvas does, no matter where
        // or in which phase the game's own listeners are registered.
        ['mousedown', 'mouseup', 'mousemove', 'click', 'wheel', 'keydown', 'keyup'].forEach((type) => {
          window.addEventListener(type, (event) => {
            if (!Module._settingsOpen) return;
            if (event.target.closest && event.target.closest('#settingsPanel, #settingsGear')) return;
            event.stopImmediatePropagation();
            event.preventDefault();
          }, true);
        });

        // If something still manages to re-acquire pointer lock while the
        // panel is open (e.g. Emscripten's own SDL relative-mouse-mode
        // handling reacting to the lock loss), immediately kick it back out.
        document.addEventListener('pointerlockchange', () => {
          if (Module._settingsOpen && document.pointerLockElement) {
            document.exitPointerLock();
          }
        });
        SETTINGS_RES_MODES.forEach((entry) => {
          var opt = document.createElement('option');
          opt.value = entry.mode;
          opt.textContent = entry.label;
          resolutionElement.appendChild(opt);
        });

        function updateCustomResVisibility() {
          customResElement.classList.toggle('hidden', resolutionElement.value != -1);
        }
        resolutionElement.addEventListener('change', updateCustomResVisibility);

        // Tab switching.
        var tabButtons = Array.prototype.slice.call(document.querySelectorAll('.settingsTabBtn'));
        var tabPanels = Array.prototype.slice.call(document.querySelectorAll('.settingsTabPanel'));
        tabButtons.forEach((btn) => {
          btn.addEventListener('click', () => {
            tabButtons.forEach((b) => b.classList.toggle('active', b === btn));
            tabPanels.forEach((p) => p.classList.toggle('hidden', p.dataset.tab !== btn.dataset.tab));
          });
        });

        // Build the generic (non-resolution) fields into their tab panels.
        // A range field gets a slider + live value label; select/bool get
        // a dropdown or a checkbox row. live:true fields also get wired
        // below to push straight to the engine via wasm_set_cvar on
        // change; live:false (CVAR_LATCH) fields only take effect via
        // Apply & Reload, same as resolution, and get a "restart required"
        // tag so it's clear why a live tweak doesn't show up instantly.
        SETTINGS_FIELDS.forEach((field) => {
          var container = document.getElementById('settingsTab_' + field.tab);
          var elId = 'settingsField_' + field.id;
          var restartTag = field.live ? '' : ' <span class="settingsRestartTag">restart required</span>';

          if (field.type === 'bool') {
            var row = document.createElement('div');
            row.className = 'settingsBoolRow';
            row.innerHTML = '<label for="' + elId + '">' + field.label + restartTag + '</label>' +
              '<input type="checkbox" id="' + elId + '">';
            container.appendChild(row);
          } else if (field.type === 'select') {
            var label = document.createElement('label');
            label.className = 'settingsFieldLabel';
            label.setAttribute('for', elId);
            label.innerHTML = '<span>' + field.label + '</span>' + restartTag;
            container.appendChild(label);
            var select = document.createElement('select');
            select.id = elId;
            field.options.forEach((opt) => {
              var o = document.createElement('option');
              o.value = opt[0];
              o.textContent = opt[1];
              select.appendChild(o);
            });
            container.appendChild(select);
          } else { // range
            var rangeLabel = document.createElement('label');
            rangeLabel.className = 'settingsFieldLabel';
            rangeLabel.setAttribute('for', elId);
            rangeLabel.innerHTML = '<span>' + field.label + ' (<span id="' + elId + '_val"></span>)</span>' + restartTag;
            container.appendChild(rangeLabel);
            var range = document.createElement('input');
            range.type = 'range';
            range.id = elId;
            range.min = field.min;
            range.max = field.max;
            range.step = field.step;
            container.appendChild(range);
          }

          var el = document.getElementById(elId);
          var valEl = document.getElementById(elId + '_val');

          function currentValue() {
            if (field.type === 'bool') return el.checked ? 1 : 0;
            if (field.type === 'select') return parseInt(el.value, 10);
            return parseFloat(el.value);
          }

          var eventName = field.type === 'range' ? 'input' : 'change';
          el.addEventListener(eventName, () => {
            if (valEl) valEl.textContent = currentValue();
            if (field.live && Module.ccall) {
              Module.ccall('wasm_set_cvar', null, ['string', 'string'], [field.cvar, String(currentValue())]);
            }
          });
        });

        function populateForm() {
          var settings = readOverlaySettings();
          resolutionElement.value = settings.rMode;
          customWidthElement.value = settings.customWidth;
          customHeightElement.value = settings.customHeight;
          updateCustomResVisibility();

          SETTINGS_FIELDS.forEach((field) => {
            var el = document.getElementById('settingsField_' + field.id);
            var valEl = document.getElementById('settingsField_' + field.id + '_val');
            var value = settings[field.id];
            // live:true fields can be changed from outside this panel (by
            // dragging without clicking Apply), so the saved value can go
            // stale - populate those from the engine's actual live cvar
            // instead, or Apply would silently save/reload with the old
            // value and clobber whatever's really in effect. live:false
            // (CVAR_LATCH) fields never get live-set at all, so the saved
            // value IS the current truth for those.
            if (field.live && Module.ccall) {
              var raw = Module.ccall('wasm_get_cvar', 'string', ['string'], [field.cvar]);
              var live = field.type === 'range' ? parseFloat(raw) : parseInt(raw, 10);
              if (!isNaN(live)) value = live;
            }
            if (field.type === 'bool') el.checked = !!value;
            else el.value = value;
            if (valEl) valEl.textContent = value;
          });
        }

        settingsGearElement.addEventListener('click', () => {
          populateForm();
          panelElement.classList.add('open');
          Module._settingsOpen = true;
          // Fullscreen is left alone here on purpose - _attemptPointerLock()
          // fullscreens documentElement (see its comment), which keeps the
          // gear/panel (siblings of the canvas) inside the fullscreen
          // top-layer subtree, so they stay visible/clickable without ever
          // needing to toggle fullscreen off. Pointer lock still needs to
          // be released though, since a locked cursor can't hit the panel.
          if (document.pointerLockElement) document.exitPointerLock();
        });
        // FOV (and anything else applied live) only lives in the engine's
        // in-memory cvar until the archive-cvar writer's throttle (every 5s
        // - see Com_Frame) gets around to it, and even wasm_flush_config()
        // only rewrites the in-memory copy - IDBFS's actual persist to
        // IndexedDB is asynchronous. Poll wasm_config_flush_busy() and only
        // call back once it's actually landed, or a reconnect/map-load (or
        // reload) shortly after can race the persist and re-exec/restore
        // the still-stale on-disk mod config over top of the live value.
        function flushConfigThen(cb) {
          if (!Module.ccall) { cb(); return; }
          Module.ccall('wasm_flush_config', null, [], []);
          (function poll() {
            if (!Module.ccall('wasm_config_flush_busy', 'number', [], [])) { cb(); return; }
            setTimeout(poll, 20);
          })();
        }

        document.getElementById('settingsCancel').addEventListener('click', () => {
          panelElement.classList.remove('open');
          Module._settingsOpen = false;
          Module._attemptPointerLock();
          flushConfigThen(() => {});
        });
        document.getElementById('settingsApply').addEventListener('click', () => {
          var rMode = parseInt(resolutionElement.value, 10);
          var settings = {
            rMode: rMode,
            customWidth: Math.min(7680, Math.max(320, parseInt(customWidthElement.value, 10) || SETTINGS_DEFAULTS.customWidth)),
            customHeight: Math.min(4320, Math.max(240, parseInt(customHeightElement.value, 10) || SETTINGS_DEFAULTS.customHeight))
          };
          SETTINGS_FIELDS.forEach((field) => {
            var el = document.getElementById('settingsField_' + field.id);
            settings[field.id] = field.type === 'bool' ? (el.checked ? 1 : 0)
              : field.type === 'select' ? parseInt(el.value, 10)
              : parseFloat(el.value);
          });
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
          // Belt-and-suspenders, same reasoning as Cancel: make sure the
          // persisted mod config on disk isn't stale before we reboot into
          // it (the fresh boot's '+seta' argv should win regardless, but
          // this keeps disk state honest too) - and this time we actually
          // MUST wait, since location.reload() throws away anything still
          // in flight.
          flushConfigThen(() => location.reload());
        });
      })();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>

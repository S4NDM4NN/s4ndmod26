<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.1 -1.1 68.2 26.2" role="img" aria-label="S4NDMoD26">
  <title>S4NDMoD26</title>
  <!-- Flat red on a 66-unit grid: one stroke weight of 2 units for every bar, numeral stroke and gap; all cuts at
       45 degrees except the heads' top edge, which slopes into a 2-unit hook.  The three wing tips lie on one 45-degree
       line (x = 64 - (y-4)).  The top bar's inner end is cut back on a 45-degree line (L1) and the slot under it closes
       on a parallel line (L2) 3 units further out, so bars 1 and 2 join through a strut about one bar thick; the
       notch beside the head has its floor at y=7, so bar 2 is 3 units thick where it meets the head, as on the
       original.  The heads' outer edge, the lower bar's end and the numerals' outer edge share one vertical line
       (x=41, mirrored 25).  Numerals are 12 tall with a V bottom. -->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S4NDMoD26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0d100e;
    --panel: #26332c;
    --panel-hi: #3d5047;
    --panel-lo: #151c18;
    --edge: #5d7568;
    --text: #cfd8cf;
    --dim: #8a9a8e;
    --red: #b3171d;
    --red-hi: #e03a3a;
    --gold: #d6b25a;
    --term: #9be88a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg) radial-gradient(ellipse at 50% 0%, #1b2620 0%, var(--bg) 70%);
    color: var(--text);
    font: 13px/1.35 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; padding: 14px 16px; gap: 12px; user-select: none; overflow: hidden;
  }
  /* beveled panel, like the in-game menus */
  .panel {
    background: var(--panel);
    border: 2px solid; border-color: var(--panel-hi) var(--panel-lo) var(--panel-lo) var(--panel-hi);
    outline: 1px solid #000;
  }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 14px; }
  .eagle { width: 54px; height: 54px; flex: none; }
  h1 {
    margin: 0; font: 900 30px/1 Impact, "Arial Black", sans-serif; letter-spacing: 3px; text-transform: uppercase;
    color: var(--red-hi); text-shadow: 2px 2px 0 #000;
  }
  h1 small { display: block; font: 600 11px/1.6 "Courier New", monospace; letter-spacing: 2px; color: var(--dim); text-shadow: none; }
  .ver { margin-left: auto; text-align: right; font: 12px "Courier New", monospace; color: var(--dim); }
  .ver b { color: var(--gold); font-weight: 600; }

  main { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #console {
    flex: 1; min-height: 0; background: #050705; color: var(--term); padding: 8px 10px;
    font: 12px/1.45 "Lucida Console", "Courier New", monospace; overflow-y: auto; user-select: text;
    border: 2px solid; border-color: var(--panel-lo) var(--panel-hi) var(--panel-hi) var(--panel-lo);
  }
  #console .w { color: var(--gold); } #console .e { color: #ff6b5e; } #console .d { color: #6f8a6a; }
  #console::-webkit-scrollbar { width: 10px; } #console::-webkit-scrollbar-thumb { background: var(--edge); }

  .status { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  #msg { font-weight: 600; letter-spacing: .3px; }
  #cur { color: var(--dim); font: 12px "Courier New", monospace; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* blocky progress bar */
  .bar { height: 22px; background: #050705; border: 2px solid; border-color: var(--panel-lo) var(--panel-hi) var(--panel-hi) var(--panel-lo); padding: 2px; }
  #fill {
    height: 100%; width: 0%; transition: width .12s linear;
    background: repeating-linear-gradient(90deg, var(--red) 0 10px, #7e0f14 10px 12px);
  }
  .bar.idle #fill { background: repeating-linear-gradient(90deg, var(--edge) 0 10px, #33453b 10px 12px); }
  .bar.spin #fill { width: 28% !important; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0 } to { margin-left: 72% } }

  footer { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  button {
    font: 700 12px "Segoe UI", sans-serif; letter-spacing: 1px; text-transform: uppercase; color: var(--text);
    background: var(--panel-hi); padding: 8px 12px; cursor: pointer; outline: 1px solid #000; white-space: nowrap;
    border: 2px solid; border-color: #6f8a7b #1a231e #1a231e #6f8a7b;
  }
  button:hover:not(:disabled) { background: #4a6156; }
  button:active:not(:disabled) { border-color: #1a231e #6f8a7b #6f8a7b #1a231e; }
  button:disabled { opacity: .45; cursor: default; }
  #play {
    margin-left: auto; font: 900 20px Impact, "Arial Black", sans-serif; letter-spacing: 3px; padding: 8px 40px;
    background: var(--red); color: #fff; text-shadow: 1px 1px 0 #000; border-color: #e5605f #4d0a0d #4d0a0d #e5605f;
  }
  #play:hover:not(:disabled) { background: var(--red-hi); }
  .path { color: var(--dim); font: 11px "Courier New", monospace; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #settings { display: none; padding: 10px 12px; gap: 8px; flex-direction: column; }
  #settings.open { display: flex; }
  #settings label { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
  #settings input {
    background: #050705; color: var(--term); font: 12px "Courier New", monospace; padding: 5px 7px; user-select: text;
    border: 2px solid; border-color: var(--panel-lo) var(--panel-hi) var(--panel-hi) var(--panel-lo);
  }
  #settings .row { display: flex; gap: 8px; justify-content: flex-end; }
  .hide { display: none !important; }
</style>
</head>
<body>
<header class="panel">
  <svg class="eagle" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="30" fill="#0a0d0b" stroke="#5d7568" stroke-width="2"/>
    <path fill="#e03a3a" d="M32 8l5 9 10-3-3 10 9 4-9 5 6 9-11-2-2 10-5-8-5 8-2-10-11 2 6-9-9-5 9-4-3-10 10 3z"/>
  </svg>
  <h1>S4NDMoD<span style="color:#fff">26</span><small>RETURN TO CASTLE WOLFENSTEIN</small></h1>
  <div class="ver">launcher <span id="lver">–</span><br>build <b id="ver">–</b></div>
</header>

<main>
  <div id="console" class="panel" aria-live="polite"></div>
  <div class="status"><span id="msg">Starting…</span><span id="cur"></span></div>
  <div class="bar idle spin" id="bar"><div id="fill"></div></div>
</main>

<div id="settings" class="panel">
  <label>Server <input id="s-server" spellcheck="false"></label>
  <label>Install folder <input id="s-dir" spellcheck="false"></label>
  <label>Connect to <input id="s-connect" spellcheck="false" placeholder="(same as server)"></label>
  <div class="row"><button id="s-cancel">Cancel</button><button id="s-save">Save &amp; check</button></div>
</div>

<footer class="panel">
  <button id="verify">Verify files</button>
  <button id="folder">Open folder</button>
  <button id="gear">Settings</button>
  <span class="path" id="dir"></span>
  <button id="play" disabled>Play</button>
</footer>

<script>
(function () {
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('console');

  function log(text, cls) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    logEl.appendChild(d);
    while (logEl.childNodes.length > 400) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function api(path, body) {
    return fetch(path, {
      method: 'POST', headers: { 'X-Token': token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.status); });
    });
  }
  function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }

  var drawn = 0;
  var settingsLoaded = false;

  function render(s) {
    $('msg').textContent = s.message || '';
    $('ver').textContent = s.version || '–';
    $('lver').textContent = s.launcher || '–';
    $('dir').textContent = s.dir || '';
    $('dir').title = s.dir || '';

    var bar = $('bar'), fill = $('fill');
    var busy = s.phase === 'checking' || s.phase === 'launching';
    bar.classList.toggle('spin', busy);
    bar.classList.toggle('idle', s.phase !== 'updating' && s.phase !== 'error');
    if (s.phase === 'updating') {
      var pct = s.bytesTotal ? Math.min(100, s.bytesDone * 100 / s.bytesTotal) : 0;
      fill.style.width = pct + '%';
      $('cur').textContent = s.current ? s.current + '  ' + mb(s.bytesDone) + ' / ' + mb(s.bytesTotal) : '';
    } else {
      fill.style.width = (s.phase === 'ready' || s.phase === 'needs_update') ? '100%' : fill.style.width;
      $('cur').textContent = '';
    }

    $('play').disabled = s.phase !== 'ready' && s.phase !== 'needs_update';
    $('play').textContent = s.phase === 'launching' ? 'Starting…' : 'Play';
    $('verify').disabled = s.phase === 'checking' || s.phase === 'updating' || s.phase === 'launching';

    // console: the server keeps the log; append whatever this page has not drawn yet
    var lg = s.log || [];
    if (lg.length < drawn) { logEl.textContent = ''; drawn = 0; }
    for (; drawn < lg.length; drawn++) log(lg[drawn].text, lg[drawn].cls);

    if (!settingsLoaded || !$('settings').classList.contains('open')) {
      $('s-server').value = s.server || '';
      $('s-dir').value = s.dir || '';
      $('s-connect').value = s.connect === hostOf(s.server) ? '' : (s.connect || '');
      settingsLoaded = true;
    }
  }
  function hostOf(u) { try { return new URL(u).hostname; } catch (e) { return ''; } }

  var es = new EventSource('/api/events?t=' + encodeURIComponent(token));
  es.onmessage = function (e) { render(JSON.parse(e.data)); };
  es.onerror = function () { /* the app closes this stream when it exits */ };

  $('play').onclick = function () { api('/api/play').catch(function (e) { log(String(e.message || e), 'e'); }); };
  $('verify').onclick = function () { api('/api/recheck'); };
  $('folder').onclick = function () { api('/api/openfolder'); };
  $('gear').onclick = function () { $('settings').classList.toggle('open'); };
  $('s-cancel').onclick = function () { $('settings').classList.remove('open'); };
  $('s-save').onclick = function () {
    api('/api/settings', { server: $('s-server').value, dir: $('s-dir').value, connect: $('s-connect').value })
      .then(function () { $('settings').classList.remove('open'); })
      .catch(function (e) { log(String(e.message || e), 'e'); });
  };
})();
</script>
</body>
</html>

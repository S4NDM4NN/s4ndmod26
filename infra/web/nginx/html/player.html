<link rel="stylesheet" href="/s4nd.css">
<style>
  :root { --inset: rgba(0,0,0,.24); }
  .sect { margin-top: 1.1rem; }
  .sect-head { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem 0.9rem; padding: 0.55rem 0.9rem; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.2)); border-bottom: 1px solid var(--panel-lo); }
  .sect-head h2 { margin: 0; padding: 0; border: 0; box-shadow: none; font: 400 1.6rem/1.2 var(--display); letter-spacing: 0.07em; text-transform: uppercase; color: var(--text); text-shadow: 1px 1px 0 #000; min-width: 0; overflow-wrap: anywhere; }
  .sect-head .sub { color: var(--faint); font-size: 0.82rem; }
  .sect-head .right { margin-left: auto; color: var(--faint); font-size: 0.82rem; }
  .sect-body { padding: 0.8rem 0.9rem; background: var(--inset); }
  #loading, #error { padding: 1rem 0; color: var(--faint); }
  #error { color: var(--bad); }
  .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.1rem; }
  .tab { font: 600 0.9rem var(--ui); color: var(--dim); background: rgba(0,0,0,.35); border: 1px solid var(--panel-hi); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  .tab:hover { color: #fff; border-color: var(--edge); }
  .tab[aria-pressed=true] { color: #2a1d00; background: var(--gold); border-color: var(--gold); }
  .tab small { margin-left: 0.4rem; opacity: .75; font-weight: 400; }
  .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 0.6rem; }
  .num { background: rgba(0,0,0,.3); border: 1px solid var(--panel-lo); padding: 0.5rem 0.7rem; min-width: 0; }
  .num b { display: block; font: 400 1.7rem/1.1 var(--display); letter-spacing: 0.04em; color: var(--text); }
  .num span { color: var(--faint); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .num small { display: block; color: var(--dim); font-size: 0.78rem; overflow-wrap: anywhere; }
  .tblwrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.t th { text-align: right; color: var(--faint); font: 600 0.72rem var(--ui); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; }
  table.t td { text-align: right; padding: 4px 8px; border-top: 1px solid var(--panel-lo); font-variant-numeric: tabular-nums; }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  .glist { display: grid; gap: 0.4rem; }
  .grow { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) auto; gap: 0.2rem 0.8rem; align-items: center; padding: 0.5rem 0.7rem; background: rgba(0,0,0,.3); border: 1px solid var(--panel-lo); color: var(--text); text-decoration: none; }
  .grow:hover { border-color: var(--gold); }
  .grow .map { font-weight: 600; overflow-wrap: anywhere; }
  .grow .when { color: var(--faint); font-size: 0.8rem; }
  .grow .nums2 { font-variant-numeric: tabular-nums; color: var(--dim); text-align: right; white-space: nowrap; }
  .res { font: 700 0.75rem var(--ui); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; padding: 3px 0; border: 1px solid; }
  .res.win { color: var(--ok); border-color: var(--ok); }
  .res.loss { color: var(--bad); border-color: var(--bad); }
  .res.draw, .res.left { color: var(--faint); border-color: var(--panel-hi); }
  .tag { font: 600 0.68rem var(--ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--panel-hi); border-radius: 999px; padding: 1px 7px; margin-left: 0.4rem; }
  .more { margin-top: 0.7rem; font: 600 0.9rem var(--ui); color: var(--link); background: none; border: 1px solid var(--edge); padding: 6px 16px; cursor: pointer; }
  .more[hidden] { display: none; }
  @media (max-width: 560px) {
    table.t th, table.t td { padding: 4px 4px; }
    table.t { font-size: 0.82rem; }
    .grow { grid-template-columns: 3.6rem minmax(0, 1fr); }
    .grow .nums2 { grid-column: 1 / -1; text-align: left; }
    .sect-head h2 { font-size: 1.3rem; }
  }
</style>

  <div class="panel sect"><div class="sect-head"><h2>Totals</h2><span class="sub" id="tsub"></span></div><div class="sect-body"><div class="nums" id="totals"></div></div></div>
  <div class="panel sect"><div class="sect-head"><h2>Records</h2></div><div class="sect-body"><div class="nums" id="records"></div></div></div>

<script src="/site.js"></script>
<script>
'use strict';
// A player is their key (the page takes it from ?id=).  Names come from the games, so they are only ever put in with textContent.
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const PID = new URLSearchParams(location.search).get('id') || '';
const POOLS = { official: 'Official', community: 'Community' };
const poolName = p => POOLS[p] || p;
let summary = null, pool = '', page = 1;

const fmt = n => Number(n).toLocaleString();
const hours = ms => ms >= 3600000 ? (ms / 3600000).toFixed(1) + ' h' : Math.round(ms / 60000) + ' min';
const metres = d => Math.round(d * 0.0254) + ' m';
function num(label, value, small) { const d = el('div', 'num'); d.append(el('b', '', value), el('span', '', label)); if (small) d.append(el('small', '', small)); return d; }

function showError(msg) { $('loading').hidden = true; $('page').hidden = true; const e = $('error'); e.textContent = msg; e.hidden = false; }

function drawTotals() {
  const t = summary.pools.find(p => p.pool === pool);
  const tot = $('totals'), rec = $('records');
  tot.textContent = ''; rec.textContent = '';
  const wl = t.wins + t.losses;
  tot.append(num('Games', fmt(t.games), t.wins + 'W ' + t.losses + 'L' + (t.draws ? ' ' + t.draws + 'D' : '')),
    num('Win rate', wl ? Math.round(100 * t.wins / wl) + '%' : '—'),
    num('Kills', fmt(t.kills)), num('Deaths', fmt(t.deaths)), num('K/D', t.deaths ? (t.kills / t.deaths).toFixed(2) : String(t.kills), 'efficiency ' + t.eff + '%'),
    num('Headshots', fmt(t.headshots)), num('Revives', fmt(t.revives)), num('Gibs', fmt(t.gibs)),
    num('Damage dealt', fmt(t.damage_given)), num('Time played', hours(t.play_ms)));
  const r = t.records;
  rec.append(num('Kill streak', fmt(r.kill_streak), 'most kills in a row without dying'), num('Best score', fmt(r.best_score), 'in one game'), num('Most kills', fmt(r.most_kills), 'in one game'));
  if (r.longest_kill) rec.append(num('Longest kill', metres(r.longest_kill.dist), r.longest_kill.weapon + (r.longest_kill.victim ? ' on ' + r.longest_kill.victim : '')));
  $('tsub').textContent = poolName(pool) + ' servers';

  const tb = $('weapons'); tb.textContent = '';
  const head = el('tr'); ['Weapon', 'Kills', 'Hits', 'Shots', 'Acc', 'HS'].forEach(h => head.append(el('th', '', h))); tb.append(head);
  t.weapons.filter(w => w.kills || w.atts || w.hits).sort((a, b) => b.kills - a.kills).forEach(w => {
    const tr = el('tr'); tr.append(el('td', '', w.name), el('td', '', fmt(w.kills)), el('td', '', fmt(w.hits)), el('td', '', fmt(w.atts)), el('td', '', w.atts ? Math.round(100 * w.hits / w.atts) + '%' : '—'), el('td', '', fmt(w.headshots)));
    tb.append(tr);
  });
}

async function loadGames(reset) {
  if (reset) { page = 1; $('games').textContent = ''; }
  const r = await fetch('/api/players/' + encodeURIComponent(PID) + '/games?pool=' + encodeURIComponent(pool) + '&page=' + page);
  if (!r.ok) { showError('Could not load the games.'); return; }
  const d = await r.json();
  d.games.forEach(g => {
    const a = el('a', 'grow'); a.href = '/game.html?r=' + encodeURIComponent(g.match);
    a.append(el('span', 'res ' + g.result, g.result));
    const mid = el('div'); const m = el('span', 'map', g.map || g.match);
    if (g.pool !== 'official') m.append(el('span', 'tag', poolName(g.pool)));
    mid.append(m, el('div', 'when', g.started_at ? new Date(g.started_at).toLocaleString() : g.match));
    a.append(mid, el('span', 'nums2', g.kills + ' kills · ' + g.deaths + ' deaths · score ' + g.score));
    $('games').append(a);
  });
  $('gcount').textContent = fmt(d.total) + ' game' + (d.total === 1 ? '' : 's');
  $('more').hidden = page * d.per >= d.total;
  if (!d.total) $('games').append(el('p', 'sub', 'No games here yet.'));
}

function pick(p) {
  pool = p;
  history.replaceState(null, '', '?id=' + encodeURIComponent(PID) + '&pool=' + encodeURIComponent(p));
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pool === p)));
  drawTotals(); loadGames(true);
}

(async () => {
  if (!/^[A-Za-z0-9_-]{43}$/.test(PID)) return showError('That is not a player link.');
  let r;
  try { r = await fetch('/api/players/' + encodeURIComponent(PID)); } catch (e) { return showError('Could not reach the server.'); }
  if (r.status === 404) return showError('No games found for this player.');
  if (!r.ok) return showError('Could not load this player.');
  summary = await r.json();
  document.title = summary.name + ' — S4NDMoD26';
  $('pname').textContent = summary.name;
  const total = summary.pools.reduce((n, p) => n + p.games, 0);
  $('psub').textContent = fmt(total) + ' games played';
  summary.pools.forEach(p => {
    const b = el('button', 'tab', poolName(p.pool)); b.type = 'button'; b.dataset.pool = p.pool; b.append(el('small', '', fmt(p.games)));
    b.addEventListener('click', () => pick(p.pool)); $('tabs').append(b);
  });
  $('more').addEventListener('click', () => { page++; loadGames(false); });
  const want = new URLSearchParams(location.search).get('pool');
  $('loading').hidden = true; $('page').hidden = false;
  pick(summary.pools.some(p => p.pool === want) ? want : summary.pools[0].pool);
})();
</script>

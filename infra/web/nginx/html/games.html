<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games — S4NDMoD26</title>
<link rel="stylesheet" href="/s4nd.css">
<style>

  #loading { color: var(--faint); padding: 1rem 0; }
  #error   { color: var(--bad); padding: 1rem 0; }

  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  thead th {
    text-align: left; color: var(--dim); font-size: 0.75rem; letter-spacing: 0.06em;
    text-transform: uppercase; border-bottom: 1px solid var(--panel-lo);
    padding: 0.4rem 0.6rem; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--gold); }
  thead th.sorted::after { content: ' ↓'; }
  thead th.sorted.asc::after { content: ' ↑'; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: rgba(0,0,0,.25); }
  td { padding: 0.35rem 0.6rem; border-bottom: 1px solid rgba(0,0,0,.35); font-size: 0.85rem; }
  td.map-col { color: var(--text); font-weight: 600; }
  td.mono { font-family: monospace; }

  .badge {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; vertical-align: middle;
  }
  .badge-potg { background: #3a2000; color: var(--gold); border: 1px solid #6a3800; }
  .badge-potg { max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.badge-play { cursor: pointer; font-family: inherit; }
  button.badge-play:hover { background: #5a3000; border-color: var(--gold); }
  .badge-ax   { background: #2a0a0a; color: #f66; border: 1px solid #5a1a1a; font-size: 0.65rem; }
  .badge-al   { background: #0a1a2a; color: #6af; border: 1px solid #1a3a5a; font-size: 0.65rem; }

  .empty { color: #444; padding: 2rem 0; }

  .filters { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .filters input[type=text] {
    background: rgba(0,0,0,.25); border: 1px solid var(--panel-lo); color: var(--text);
    padding: 0.3rem 0.6rem; border-radius: 3px; font-family: monospace; font-size: 0.85rem;
    outline: none; width: 180px;
  }
  .filters input[type=text]:focus { border-color: var(--faint); }
  .filters select {
    background: rgba(0,0,0,.25); border: 1px solid var(--panel-lo); color: var(--text);
    padding: 0.3rem 0.6rem; border-radius: 3px; font-family: monospace; font-size: 0.85rem;
    outline: none;
  }
  .count { color: var(--faint); font-size: 0.8rem; }
  .sort-mobile { display: none; }

  /* Phones: the 7-column table is wider than the screen (the Kills column and the play button fell
     off the right edge), so each game becomes a card instead. */
  @media (max-width: 640px) {



    .filters { gap: 0.6rem; }
    .filters input[type=text] { flex: 1 1 100%; width: 100%; }
    .filters select { flex: 1 1 40%; }
    .filters input[type=text], .filters select { font-size: 16px; min-height: 44px; }  /* 16px: no iOS zoom */
    .sort-mobile { display: block; }
    .count { flex: 1 1 100%; }

    table, tbody { display: block; }
    thead { display: none; }
    tbody tr {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.7rem;
      padding: 0.75rem; margin-bottom: 0.6rem;
      background: #161616; border: 1px solid #242424; border-radius: 6px;
    }
    tbody tr:hover td { background: transparent; }
    td { display: block; padding: 0; border: 0; font-size: 0.9rem; }
    td:nth-child(2) { order: 1; flex: 1 1 auto; font-size: 1.1rem; }              /* map */
    td:nth-child(4) { order: 2; color: var(--text); }                                    /* duration */
    td:nth-child(1) { order: 3; flex-basis: 100%; color: #777; font-size: 0.8rem; } /* date */
    td:nth-child(3) { order: 4; }                                                 /* gametype */
    td:nth-child(5) { order: 5; color: var(--dim); }
    td:nth-child(5)::after { content: ' players'; }
    td:nth-child(6) { order: 6; color: var(--dim); }
    td:nth-child(6)::after { content: ' kills'; }
    td:nth-child(7) { order: 7; flex-basis: 100%; margin-top: 0.45rem; }          /* POTG */
    td:nth-child(7):empty { display: none; }

    .badge-potg { max-width: 100%; font-size: 0.85rem; padding: 0.5rem 0.75rem; }
    button.badge-play { display: block; width: 100%; min-height: 44px; text-align: left; }
  }
</style>

<body class="s4">
<div class="wrap" style="max-width:1100px">
<header class="s4-header panel">

    <div><h1>S4NDMoD<span>26</span></h1><small>A Return to Castle Wolfenstein mod</small></div>

    <a data-umami-event="click-facebook" href="https://www.facebook.com/S4NDMoD/" class="icon-link" target="_blank" rel="noopener" title="S4NDMoD on Facebook">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94Z"/></svg>
    </a>

</header>

<h2>Games</h2>

<div class="filters">
  <input type="text" id="search" placeholder="Filter map…" oninput="applyFilters()">
  <select id="gt-filter" onchange="applyFilters()">
    <option value="">All gametypes</option>
  </select>
  <select id="sort-select" class="sort-mobile" aria-label="Sort games" onchange="sortFromSelect()">
    <option value="date:desc">Newest first</option>
    <option value="date:asc">Oldest first</option>
    <option value="duration:desc">Longest</option>
    <option value="duration:asc">Shortest</option>
    <option value="kills:desc">Most kills</option>
    <option value="players:desc">Most players</option>
    <option value="map:asc">Map A–Z</option>
  </select>
  <span id="count" class="count"></span>
</div>

<div id="loading">Loading…</div>
<div id="error" style="display:none"></div>
<div id="table-wrap" style="display:none">
  <table>
    <thead>
      <tr>
        <th data-col="date"     onclick="sortBy('date')">Date</th>
        <th data-col="map"      onclick="sortBy('map')">Map</th>
        <th data-col="gametype" onclick="sortBy('gametype')">Gametype</th>
        <th data-col="duration" onclick="sortBy('duration')">Duration</th>
        <th data-col="players"  onclick="sortBy('players')">Players</th>
        <th data-col="kills"    onclick="sortBy('kills')">Kills</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <p class="empty" id="empty-msg" style="display:none">No games match your filter.</p>
</div>

<script>
'use strict';

let allGames = [];
let sortCol = 'date';
let sortAsc = false;
let filterMap = '';
let filterGT = '';

function fmtDuration(ms) {
  if (!ms) return '—';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

function fmtDate(iso) {
  if (!iso) return '—';
  // ISO format: 2026-06-06T02:25:49Z — parse as UTC
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) +
    ' ' + d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit', hour12: false});
}

// "<player> POTG": whose play it is, so the right one is easy to find in the list.
function potgLabel(g) {
  return (g.potg_player ? esc(g.potg_player) + ' ' : '') + 'POTG';
}

// Watch the play of the game in a modal over this page.  /play/ needs SharedArrayBuffer, which a
// browser only grants to a cross-origin isolated page, and an iframe is only isolated if the page
// embedding it is too.  This page is served with the same COOP/COEP headers as /play/ (nginx.conf),
// so the iframe qualifies; if isolation is somehow unavailable, fall back to a popup window.
function openPotgPlayer(name, player) {
  // with a player number this is that player's highlight rather than the play of the game
  const isHighlight = player !== undefined && player !== null && player !== '';
  const url = '/play/?replay=' + encodeURIComponent(name) + (isHighlight ? '&player=' + encodeURIComponent(player) : '');
  if (!window.crossOriginIsolated) {
    const w = window.open(url, 'potg_' + name, 'popup=yes,width=1100,height=680');
    if (!w) alert('Allow pop-ups for this site to watch the play of the game.');
    return;
  }
  if (document.getElementById('potg-modal')) return;

  if (!document.getElementById('potg-modal-style')) {
    const st = document.createElement('style');
    st.id = 'potg-modal-style';
    st.textContent =
      '#potg-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center}' +
      '#potg-modal .potg-box{width:min(96vw,1200px);height:min(90vh,760px);background:#09090b;border:1px solid #6a3800;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7)}' +
      '#potg-modal .potg-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#18181b;color:#fbbf24;font:600 13px system-ui,sans-serif;flex:none}' +
      '#potg-modal .potg-bar a{color:#a1a1aa;font-weight:400;font-size:12px;margin-right:14px;text-decoration:none}' +
      '#potg-modal .potg-bar a:hover{color:#fff}' +
      '#potg-modal .potg-bar a svg{display:none;vertical-align:middle}' +
      '#potg-modal .potg-bar button{background:none;border:0;color:#a1a1aa;font-size:18px;line-height:1;cursor:pointer;padding:2px 6px}' +
      '#potg-modal .potg-bar button:hover{color:#fff}' +
      '#potg-modal iframe{flex:1;width:100%;border:0;background:#000}' +
      '@media (max-width:700px),(max-height:500px){#potg-modal .potg-box{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0}' +
      '#potg-modal .potg-bar{padding:0 4px 0 12px}' +
      '#potg-modal .potg-bar a,#potg-modal .potg-bar button{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;margin:0}' +
      '#potg-modal .potg-bar a .txt{display:none}#potg-modal .potg-bar a svg{display:inline}' +
      '#potg-modal .potg-bar button{font-size:22px}}';
    document.head.appendChild(st);
  }

  const back = document.createElement('div');
  back.id = 'potg-modal';
  const box = document.createElement('div');
  box.className = 'potg-box';
  const bar = document.createElement('div');
  bar.className = 'potg-bar';
  const title = document.createElement('span');
  title.textContent = isHighlight ? '★ Highlight' : '★ Play of the Game';
  const right = document.createElement('span');
  const pop = document.createElement('a');
  pop.href = url; pop.target = '_blank'; pop.rel = 'noopener';
  pop.title = 'Open in a new window';
  pop.setAttribute('aria-label', 'Open in a new window');
  const popTxt = document.createElement('span');
  popTxt.className = 'txt';
  popTxt.textContent = 'open in new window';
  pop.append(popTxt);
  pop.insertAdjacentHTML('beforeend', '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3h6v6M17 3l-8 8M14 11v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>');
  // Render the clip to a 1080p60 MP4 in this browser (the player page does the work; see wasm/shell.html)
  const exp = document.createElement('a');
  exp.href = url + '&export=1';
  exp.title = 'Render this clip to a 1080p MP4 video';
  exp.setAttribute('aria-label', 'Export as MP4');
  const expTxt = document.createElement('span');
  expTxt.className = 'txt';
  expTxt.textContent = 'export MP4';
  exp.append(expTxt);
  exp.insertAdjacentHTML('beforeend', '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M6 9l4 4 4-4M3 17h14"/></svg>');
  exp.addEventListener('click', (e) => {
    e.preventDefault();
    title.textContent = '★ Exporting MP4';
    frame.src = url + '&export=1';
    exp.remove();
    pop.remove();
  });
  const close = document.createElement('button');
  close.type = 'button'; close.setAttribute('aria-label', 'Close'); close.textContent = '✕';
  right.append(exp, pop, close);
  bar.append(title, right);

  const frame = document.createElement('iframe');
  frame.allow = 'fullscreen; autoplay; gamepad; cross-origin-isolated';
  frame.src = url;
  frame.addEventListener('load', () => frame.focus());
  box.append(bar, frame);
  back.append(box);

  const onKey = (e) => { if (e.key === 'Escape') closeModal(); };
  function closeModal() {
    document.removeEventListener('keydown', onKey);
    frame.src = 'about:blank';      // tear the engine down
    back.remove();
  }
  close.addEventListener('click', closeModal);
  pop.addEventListener('click', closeModal);
  back.addEventListener('mousedown', (e) => { if (e.target === back) closeModal(); });
  document.addEventListener('keydown', onKey);
  document.body.append(back);
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sortBy(col) {
  if (sortCol === col) { sortAsc = !sortAsc; }
  else { sortCol = col; sortAsc = col === 'map' || col === 'gametype'; }
  renderTable();
  updateSortUI();
}

// Mobile hides the column headers, so sorting goes through a dropdown that drives the same state.
function sortFromSelect() {
  const [col, dir] = document.getElementById('sort-select').value.split(':');
  sortCol = col;
  sortAsc = dir === 'asc';
  renderTable();
  updateSortUI();
}

function updateSortUI() {
  const sel = document.getElementById('sort-select');
  const want = sortCol + ':' + (sortAsc ? 'asc' : 'desc');
  sel.value = [...sel.options].some(o => o.value === want) ? want : '';
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.remove('sorted', 'asc');
    if (th.dataset.col === sortCol) {
      th.classList.add('sorted');
      if (sortAsc) th.classList.add('asc');
    }
  });
}

function applyFilters() {
  filterMap = document.getElementById('search').value.trim().toLowerCase();
  filterGT  = document.getElementById('gt-filter').value;
  renderTable();
}

function renderTable() {
  let games = allGames.filter(g => {
    if (filterMap && !g.map.toLowerCase().includes(filterMap)) return false;
    if (filterGT && String(g.gametype) !== filterGT) return false;
    return true;
  });

  games.sort((a, b) => {
    let av, bv;
    switch (sortCol) {
      case 'date':     av = a.generated_at; bv = b.generated_at; break;
      case 'map':      av = a.map;          bv = b.map;          break;
      case 'gametype': av = a.gametype_name;bv = b.gametype_name;break;
      case 'duration': av = a.duration_ms;  bv = b.duration_ms;  break;
      case 'players':  av = a.player_count; bv = b.player_count; break;
      case 'kills':    av = a.kill_count;   bv = b.kill_count;   break;
      default:         av = 0; bv = 0;
    }
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  games.forEach(g => {
    const tr = document.createElement('tr');
    tr.title = 'View timeline →';
    tr.onclick = (e) => {
      const play = e.target.closest && e.target.closest('.badge-play');
      if (play) { openPotgPlayer(play.dataset.replay); return; }
      window.location.href = '/timeline.html?mode=replay&r=' + encodeURIComponent(g.name);
    };
    tr.innerHTML =
      '<td class="mono">'  + esc(fmtDate(g.generated_at)) + '</td>' +
      '<td class="map-col">' + esc(g.map) + '</td>' +
      '<td>' + esc(g.gametype_name) + '</td>' +
      '<td class="mono">' + fmtDuration(g.duration_ms) + '</td>' +
      '<td>' + (g.player_count || '—') + '</td>' +
      '<td>' + (g.kill_count   || '0') + '</td>' +
      '<td>' + (g.has_potg
        ? (g.has_rpl
            ? '<button type="button" class="badge badge-potg badge-play" data-replay="' + esc(g.name) +
              '" title="Watch the play of the game' + (g.potg_player ? ' by ' + esc(g.potg_player) : '') + '">&#9654; ' + potgLabel(g) + '</button>'
            : '<span class="badge badge-potg">' + potgLabel(g) + '</span>')
        : '') + '</td>';
    tbody.appendChild(tr);
  });

  const empty = document.getElementById('empty-msg');
  empty.style.display = games.length === 0 ? '' : 'none';

  document.getElementById('count').textContent =
    games.length === allGames.length
      ? allGames.length + ' games'
      : games.length + ' of ' + allGames.length + ' games';
}

function populateGTFilter(games) {
  const types = {};
  games.forEach(g => { types[g.gametype] = g.gametype_name; });
  const sel = document.getElementById('gt-filter');
  Object.keys(types).sort().forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = types[k];
    sel.appendChild(opt);
  });
}

fetch('/api/replays')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-wrap').style.display = '';
    allGames = data || [];
    populateGTFilter(allGames);
    updateSortUI();
    renderTable();
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error');
    el.textContent = 'Failed to load games: ' + err.message;
    el.style.display = '';
  });

</script>
</div>
</body>
</html>

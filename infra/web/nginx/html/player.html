<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player — S4NDMoD26</title>
<link rel="stylesheet" href="/s4nd.css">
<style>
  :root { --inset: rgba(0,0,0,.24); }
  .sect { margin-top: 1.1rem; }
  .sect-head { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem 0.9rem; padding: 0.55rem 0.9rem; background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.2)); border-bottom: 1px solid var(--panel-lo); }
  .sect-head h2 { margin: 0; padding: 0; border: 0; box-shadow: none; font: 400 1.6rem/1.2 var(--display); letter-spacing: 0.07em; text-transform: uppercase; color: var(--text); text-shadow: 1px 1px 0 #000; min-width: 0; overflow-wrap: anywhere; }
  .sect-head .sub { color: var(--faint); font-size: 0.82rem; }
  .sect-head .right { margin-left: auto; color: var(--faint); font-size: 0.82rem; }
  .sect-body { padding: 0.8rem 0.9rem; background: var(--inset); }
  #loading, #error { padding: 1rem 0; color: var(--faint); }
  #error { color: var(--bad); }
  .aka { background: var(--inset); padding: 0.45rem 0.9rem; }
  .aka summary { cursor: pointer; color: var(--link); font-size: 0.85rem; }
  .aka summary:hover { color: #c4e6ff; }
  #aliaslist { margin-top: 0.4rem; max-height: 9rem; overflow-y: auto; }
  .alias { display: inline-block; margin: 0.15rem 0.3rem 0.15rem 0; padding: 1px 9px; border: 1px solid var(--panel-hi); border-radius: 999px; background: rgba(0,0,0,.35); color: var(--text); font-size: 0.85rem; overflow-wrap: anywhere; }
  .alias small { color: var(--faint); margin-left: 0.4rem; }
  .sect-head h2 .avatar { vertical-align: middle; border-radius: 50%; border: 2px solid var(--gold); width: 44px; height: 44px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1.1rem; }
  .tab { font: 600 0.9rem var(--ui); color: var(--dim); background: rgba(0,0,0,.35); border: 1px solid var(--panel-hi); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  .tab:hover { color: #fff; border-color: var(--edge); }
  .tab[aria-pressed=true] { color: #2a1d00; background: var(--gold); border-color: var(--gold); }
  .tab small { margin-left: 0.4rem; opacity: .75; font-weight: 400; }
  .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 0.6rem; }
  .num { background: rgba(0,0,0,.3); border: 1px solid var(--panel-lo); padding: 0.5rem 0.7rem; min-width: 0; }
  .num b { display: block; font: 400 1.7rem/1.1 var(--display); letter-spacing: 0.04em; color: var(--text); }
  .num span { color: var(--faint); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .num small { display: block; color: var(--dim); font-size: 0.78rem; overflow-wrap: anywhere; }
  .tblwrap { overflow-x: auto; }
  table.t { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.t th { text-align: right; color: var(--faint); font: 600 0.72rem var(--ui); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; }
  table.t td { text-align: right; padding: 4px 8px; border-top: 1px solid var(--panel-lo); font-variant-numeric: tabular-nums; }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  .glist { display: grid; gap: 0.4rem; }
  .grow { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) auto; gap: 0.2rem 0.8rem; align-items: center; padding: 0.5rem 0.7rem; background: rgba(0,0,0,.3); border: 1px solid var(--panel-lo); color: var(--text); text-decoration: none; }
  .grow:hover { border-color: var(--gold); }
  .grow .map { font-weight: 600; overflow-wrap: anywhere; }
  .grow .when { color: var(--faint); font-size: 0.8rem; }
  .grow .nums2 { font-variant-numeric: tabular-nums; color: var(--dim); text-align: right; white-space: nowrap; }
  .res { font: 700 0.75rem var(--ui); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; padding: 3px 0; border: 1px solid; }
  .res.win { color: var(--ok); border-color: var(--ok); }
  .res.loss { color: var(--bad); border-color: var(--bad); }
  .res.draw, .res.left { color: var(--faint); border-color: var(--panel-hi); }
  .tag { font: 600 0.68rem var(--ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--panel-hi); border-radius: 999px; padding: 1px 7px; margin-left: 0.4rem; }
  /* the player's own clips: a picture of the map with a play button, and what it is */
  .clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(14.5rem, 1fr)); gap: 0.6rem; }
  .clip { background: rgba(0,0,0,.3); border: 1px solid var(--panel-lo); min-width: 0; display: flex; flex-direction: column; }
  .clip.potg { border-top-color: var(--gold); }
  .clip .shot { position: relative; height: 5.5rem; background: #0a0d0b center / cover no-repeat; border: 0; padding: 0; cursor: pointer; width: 100%; }
  .clip .shot span { position: absolute; left: 50%; top: 50%; width: 2.6rem; height: 2.6rem; margin: -1.3rem 0 0 -1.3rem; border-radius: 50%; border: 2px solid var(--gold); background: rgba(0,0,0,.6); color: var(--gold); display: flex; align-items: center; justify-content: center; padding-left: 3px; }
  .clip .shot:hover span, .clip .shot:focus-visible span { background: var(--gold); color: #2a1d00; }
  .clip .info { padding: 0.45rem 0.6rem 0.55rem; display: grid; gap: 0.15rem; }
  .clip .kind { font: 600 0.78rem var(--ui); color: var(--gold); }
  .clip .kind.hl { color: var(--dim); }
  .clip .kind b { color: var(--text); }
  .clip .meta { color: var(--faint); font-size: 0.8rem; display: flex; justify-content: space-between; gap: 0.5rem; }
  .clip .meta a { color: var(--link); }
  .more { margin-top: 0.7rem; font: 600 0.9rem var(--ui); color: var(--link); background: none; border: 1px solid var(--edge); padding: 6px 16px; cursor: pointer; }
  .more[hidden] { display: none; }
  @media (max-width: 560px) {
    table.t th, table.t td { padding: 4px 4px; }
    table.t { font-size: 0.82rem; }
    .grow { grid-template-columns: 3.6rem minmax(0, 1fr); }
    .grow .nums2 { grid-column: 1 / -1; text-align: left; }
    .sect-head h2 { font-size: 1.3rem; }
    .clips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .clip .shot { height: 4.2rem; }
    .clip .meta { flex-direction: column; gap: 0.05rem; }
  }
</style>
<link rel="icon" type="image/svg+xml" href="/img/s4nd-icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<script defer crossorigin="anonymous" src="https://stats.s4ndmod.com/script.js" data-website-id="e84f2cf6-0be1-41da-9a49-37ce45da7845" data-domains="s4ndmod.com,www.s4ndmod.com"></script>
</head>
<body class="s4">
<div class="wrap">
<!--# include virtual="/partials/top.html" -->

<div id="loading">Loading&hellip;</div>
<div id="error" hidden></div>
<div id="page" hidden>
  <div class="panel sect">
    <div class="sect-head"><h2 id="pname"></h2><span class="sub" id="psub"></span></div>
    <details class="aka" id="aliases" hidden><summary id="akasum"></summary><div id="aliaslist"></div></details>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel sect"><div class="sect-head"><h2>Totals</h2><span class="sub" id="tsub"></span></div><div class="sect-body"><div class="nums" id="totals"></div></div></div>
  <div class="panel sect"><div class="sect-head"><h2>Records</h2></div><div class="sect-body"><div class="nums" id="records"></div></div></div>
  <div class="panel sect" id="clips-sect" hidden><div class="sect-head"><h2>Recent highlights</h2><span class="sub" id="ccount"></span></div>
    <div class="sect-body"><div class="clips" id="clips"></div><button type="button" class="more" id="cmore" hidden>Show more</button></div></div>
  <div class="panel sect"><div class="sect-head"><h2>Weapons</h2></div><div class="sect-body tblwrap"><table class="t" id="weapons" title="HS = headshots"></table></div></div>
  <div class="panel sect"><div class="sect-head"><h2>Games</h2><span class="right" id="gcount"></span></div>
    <div class="sect-body"><div class="glist" id="games"></div><button type="button" class="more" id="more" hidden>Show more</button></div></div>
</div>

<!--# include virtual="/partials/footer.html" -->
<script src="/site.js"></script>
<script src="/potg.js"></script>
<script>
'use strict';
// A player is their key (the page takes it from ?id=).  Names come from the games, so they are only ever put in with textContent.
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
// who: a player key (?id=) or an account's username (?u=).  A key that is linked to an account shows the whole account.
const QS = new URLSearchParams(location.search);
const WHO_PARAM = QS.has('u') ? 'u' : 'id';
const PID = QS.get('u') || QS.get('id') || '';
const POOLS = { official: 'Official', community: 'Community' };
const poolName = p => POOLS[p] || p;
let summary = null, pool = '', page = 1, WHO = PID;

const fmt = n => Number(n).toLocaleString();
const hours = ms => ms >= 3600000 ? (ms / 3600000).toFixed(1) + ' h' : Math.round(ms / 60000) + ' min';
const metres = d => Math.round(d * 0.0254) + ' m';
function num(label, value, small) { const d = el('div', 'num'); d.append(el('b', '', value), el('span', '', label)); if (small) d.append(el('small', '', small)); return d; }

function showError(msg) { $('loading').hidden = true; $('page').hidden = true; const e = $('error'); e.textContent = msg; e.hidden = false; }

function drawTotals() {
  const t = summary.pools.find(p => p.pool === pool);
  const tot = $('totals'), rec = $('records');
  tot.textContent = ''; rec.textContent = '';
  const wl = t.wins + t.losses;
  const min = t.play_ms / 60000;
  const per = n => min >= 1 ? (n / min).toFixed(2) : '—';
  // rates first (they stay readable after thousands of games); the lifetime total sits underneath
  tot.append(num('Games', fmt(t.games), t.wins + 'W ' + t.losses + 'L' + (t.draws ? ' ' + t.draws + 'D' : '')),
    num('Win rate', wl ? Math.round(100 * t.wins / wl) + '%' : '—'),
    num('K/D', t.deaths ? (t.kills / t.deaths).toFixed(2) : String(t.kills), fmt(t.kills) + ' kills · ' + fmt(t.deaths) + ' deaths'),
    num('Kills / min', per(t.kills)),
    num('Damage / min', min >= 1 ? fmt(Math.round(t.damage_given / min)) : '—', fmt(t.damage_given) + ' total'),
    num('Headshots', fmt(t.headshots), (min >= 1 ? per(t.headshots) + ' per minute · ' : '') + 'hits on the head'),
    num('Revives / hour', min >= 1 ? (t.revives / min * 60).toFixed(1) : '—', fmt(t.revives) + ' total'),
    num('Time played', hours(t.play_ms), 'about ' + (t.games ? Math.round(min / t.games) : 0) + ' min a game'));
  const r = t.records;
  rec.append(num('Kill streak', fmt(r.kill_streak), 'most kills in a row without dying'), num('Best score', fmt(r.best_score), 'in one game'), num('Most kills', fmt(r.most_kills), 'in one game'));
  if (r.longest_kill) rec.append(num('Longest kill', metres(r.longest_kill.dist), r.longest_kill.weapon + (r.longest_kill.victim ? ' on ' + r.longest_kill.victim : '')));
  $('tsub').textContent = poolName(pool) + ' servers';

  const tb = $('weapons'); tb.textContent = '';
  const head = el('tr'); ['Weapon', 'Kills', 'Hits', 'Shots', 'Acc', 'HS'].forEach(h => head.append(el('th', '', h))); tb.append(head);
  t.weapons.filter(w => w.kills || w.atts || w.hits).sort((a, b) => b.kills - a.kills).forEach(w => {
    const tr = el('tr'); tr.append(el('td', '', w.name), el('td', '', fmt(w.kills)), el('td', '', fmt(w.hits)), el('td', '', fmt(w.atts)), el('td', '', w.atts ? Math.round(100 * w.hits / w.atts) + '%' : '—'), el('td', '', fmt(w.headshots)));
    tb.append(tr);
  });
}

async function loadGames(reset) {
  if (reset) { page = 1; $('games').textContent = ''; }
  const r = await fetch('/api/players/' + encodeURIComponent(WHO) + '/games?pool=' + encodeURIComponent(pool) + '&page=' + page);
  if (!r.ok) { showError('Could not load the games.'); return; }
  const d = await r.json();
  d.games.forEach(g => {
    const a = el('a', 'grow'); a.href = '/game.html?r=' + encodeURIComponent(g.match);
    a.append(el('span', 'res ' + g.result, g.result));
    const mid = el('div'); const m = el('span', 'map', g.map || g.match);
    if (g.pool !== 'official') m.append(el('span', 'tag', poolName(g.pool)));
    mid.append(m, el('div', 'when', g.started_at ? new Date(g.started_at).toLocaleString() : g.match));
    a.append(mid, el('span', 'nums2', g.kills + ' kills · ' + g.deaths + ' deaths · score ' + g.score));
    $('games').append(a);
  });
  $('gcount').textContent = fmt(d.total) + ' game' + (d.total === 1 ? '' : 's');
  $('more').hidden = page * d.per >= d.total;
  if (!d.total) $('games').append(el('p', 'sub', 'No games here yet.'));
}

// The player's play-of-the-game and highlight clips from the games whose recording still exists (they go with the replays, so
// an older game has none).  The section stays hidden when there are none.
const CLIPS_AT_FIRST = 6, CLIPS_MORE = 12;
let clips = [], clipsShown = 0;
function drawClips() {
  const box = $('clips');
  clips.slice(clipsShown, clipsShown + (clipsShown ? CLIPS_MORE : CLIPS_AT_FIRST)).forEach((c, k) => {
    const i = clipsShown + k, potg = c.kind === 'potg';
    const card = el('div', 'clip' + (potg ? ' potg' : ''));
    const shot = el('button', 'shot'); shot.type = 'button'; shot.dataset.i = i;
    shot.style.backgroundImage = "url('/api/levelshot/" + encodeURIComponent(c.map) + "')";
    shot.setAttribute('aria-label', (potg ? 'Watch the play of the game on ' : 'Watch the highlight on ') + c.map);
    shot.append(el('span', '', '\u25B6'));
    const info = el('div', 'info');
    const kind = el('div', 'kind' + (potg ? '' : ' hl'));
    if (potg) kind.textContent = '\u2605 Play of the game'; else { kind.append(el('b', '', fmt(c.score)), document.createTextNode(' point highlight')); }
    const meta = el('div', 'meta'); meta.append(el('span', '', c.map + (c.at ? ' \u00B7 ' + new Date(c.at).toLocaleDateString() : '')));
    const g = el('a', '', c.has_stats ? 'Game' : 'Timeline'); g.href = (c.has_stats ? '/game.html?r=' : '/timeline.html?mode=replay&r=') + encodeURIComponent(c.match);
    meta.append(g);
    info.append(kind, meta); card.append(shot, info); box.append(card);
  });
  clipsShown = Math.min(clips.length, clipsShown + (clipsShown ? CLIPS_MORE : CLIPS_AT_FIRST));
  $('cmore').hidden = clipsShown >= clips.length;
  $('cmore').textContent = 'Show more (' + (clips.length - clipsShown) + ' left)';
}
async function loadClips() {
  try {
    const r = await fetch('/api/players/' + encodeURIComponent(WHO) + '/clips');
    if (!r.ok) return;
    clips = (await r.json()).clips || [];
  } catch (e) { return; }
  if (!clips.length) return;
  $('ccount').textContent = fmt(clips.length) + (clips.length === 1 ? ' clip' : ' clips') + ' from recent games';
  $('clips-sect').hidden = false;
  drawClips();
  $('cmore').addEventListener('click', drawClips);
  $('clips').addEventListener('click', e => {
    const b = e.target.closest('.shot'); const c = b && clips[Number(b.dataset.i)];
    if (c) openPotgPlayer(c.match, c.kind === 'highlight' ? c.player : undefined);
  });
}

function pick(p) {
  pool = p;
  const w = summary && summary.account ? ['u', summary.account.username] : [WHO_PARAM, PID];
  history.replaceState(null, '', '?' + w[0] + '=' + encodeURIComponent(w[1]) + '&pool=' + encodeURIComponent(p));
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pool === p)));
  drawTotals(); loadGames(true);
}

(async () => {
  if (!/^[A-Za-z0-9_-]{43}$/.test(PID) && !/^[A-Za-z0-9_-]{3,24}$/.test(PID)) return showError('That is not a player link.');
  let r;
  try { r = await fetch('/api/players/' + encodeURIComponent(PID)); } catch (e) { return showError('Could not reach the server.'); }
  if (r.status === 404) return showError('No games found for this player.');
  if (!r.ok) return showError('Could not load this player.');
  summary = await r.json();
  document.title = (summary.account ? summary.account.username : summary.name) + ' — S4NDMoD26';
  const acct = summary.account;
  if (acct) {
    // the account's name and picture; the page is the account's, however many keys it adds up (and whichever of them the link named)
    WHO = acct.username;
    if (/^(soldier|medic|engineer|lieutenant)_(axis|allies)$/.test(acct.avatar || '')) {
      const img = el('img', 'avatar'); img.src = '/img/avatars/' + acct.avatar + '.png'; img.alt = ''; img.width = 48; img.height = 48;
      $('pname').append(img, ' ');
    }
    $('pname').append(document.createTextNode(acct.username));
  } else {
    $('pname').textContent = summary.name;
  }
  const total = summary.pools.reduce((n, p) => n + p.games, 0);
  $('psub').textContent = fmt(total) + (total === 1 ? ' game played' : ' games played') + (acct && summary.keys > 1 ? ' · ' + summary.keys + ' player ids' : '');
  if (!summary.pools.length) {
    // an account that has not played yet
    $('loading').hidden = true; $('page').hidden = false;
    document.querySelectorAll('#page .sect:not(:first-child)').forEach(e => { e.hidden = true; });
    $('tabs').hidden = true;
    const hint = el('div', 'sect-body', 'No games yet. Games you play in the browser while signed in, or from a player id linked to this account, show up here.');
    $('pname').closest('.sect').append(hint);
    return;
  }
  if (summary.aliases && summary.aliases.length) {
    // collapsed: a player with many names must not fill the top of the page
    const n = summary.alias_total || summary.aliases.length;
    $('akasum').textContent = 'Also played as ' + n + ' other name' + (n === 1 ? '' : 's');
    summary.aliases.forEach(a => {
      const c = el('span', 'alias', a.name);
      c.title = 'Last used ' + (a.last_seen ? new Date(a.last_seen).toLocaleDateString() : 'a while ago') + ' · ' + a.games + ' game' + (a.games === 1 ? '' : 's');
      $('aliaslist').append(c);
    });
    if (n > summary.aliases.length) $('aliaslist').append(el('span', 'sub', 'and ' + (n - summary.aliases.length) + ' older'));
    $('aliases').hidden = false;
  }
  summary.pools.forEach(p => {
    const b = el('button', 'tab', poolName(p.pool)); b.type = 'button'; b.dataset.pool = p.pool; b.append(el('small', '', fmt(p.games)));
    b.addEventListener('click', () => pick(p.pool)); $('tabs').append(b);
  });
  $('more').addEventListener('click', () => { page++; loadGames(false); });
  const want = new URLSearchParams(location.search).get('pool');
  $('loading').hidden = true; $('page').hidden = false;
  pick(summary.pools.some(p => p.pool === want) ? want : summary.pools[0].pool);
  loadClips();
})();
</script>
</body>
</html>

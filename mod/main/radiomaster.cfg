// RadioMaster (or similar RC transmitter used as a USB joystick) overrides.
// exec this AFTER controller.cfg, e.g. in autoexec.cfg:
//   exec controller.cfg
//   exec radiomaster.cfg
//
// Tested against a RadioMaster TX15 (VID 1209 / PID 4f54) on the WASM/
// browser client specifically - the browser's Gamepad API enumerates this
// device's raw axes in a DIFFERENT order than the native Linux joystick
// device does, so don't trust axis findings from native SDL2/evtest
// testing for this build; they don't carry over.
//
// The engine's WASM-only synthetic controller mapping (IN_InitJoystick's
// __EMSCRIPTEN__ block in code/sdl/sdl_input.c) assumes a generic
// symmetric "two 2-axis sticks + two triggers" layout
// (leftx:a0,lefty:a1,lefttrigger:a2,rightx:a3,righty:a4,righttrigger:a5)
// that doesn't match this radio's real layout (right stick = 2 axes,
// left stick = 1 yaw axis + a separate non-centering throttle axis, so
// the assumed "righty" slot lands on a raw axis this radio never
// drives). That mismatch is why the physical/logical axis roles below
// don't follow the SDL slot names at face value - confirmed by moving
// one control at a time and watching navigator.getGamepads()[0].axes
// live in the browser:
//   raw a0 = right stick X (roll)   -> lands on SDL slot LEFTX  (0)
//   raw a1 = right stick Y (pitch)  -> lands on SDL slot LEFTY  (1)
//   raw a2 = throttle (non-centering) -> lands on SDL slot TRIGGERLEFT (4)
//   raw a3 = left stick X (yaw)     -> lands on SDL slot RIGHTX (2)
//   raw a4, a5 = unused/dead on this unit
seta j_side_axis    "2"
seta j_forward_axis "4"
seta j_yaw_axis     "0"
seta j_pitch_axis   "1"

// This radio's throttle lands on a trigger-shaped SDL slot rather than a
// stick Y axis. The engine only routes a gamepad axis into
// cl.joystickAxis[] if the digital key tied to that axis is bound to a
// "+"-command its digital->analog translator recognizes (KeyToAxisAndSign
// in code/sdl/sdl_input.c) - PAD0_LEFTTRIGGER defaults to "+speed" in
// controller.cfg, which isn't recognized, so throttle data never reaches
// the game at all regardless of j_forward_axis's value until rebound.
bind PAD0_LEFTTRIGGER "+forward"

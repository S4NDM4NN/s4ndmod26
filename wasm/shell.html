<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>S4NDMoD26 — Play in Browser</title>
    <style>
      body {
        background-color: black;
        color: rgb(224,224,224);
        font-family: Arial,Helvetica,sans-serif;
        font-size: 16px;
        margin: 0px;
        min-height: 100vh;
        overflow: hidden;
      }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      textarea.emscripten {
        font-family: monospace;
        font-size: 14px;
        width: calc(100% - 24px);
        height: calc(100vh - 24px);
        margin-top: 8px;
        background-color: inherit;
        color: rgb(192, 192, 192);
        border: 1px solid rgb(64, 64, 64);
        resize: none;
        display: none;
        outline: none;
      }
      div.emscripten { text-align: center; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        border: 0px none;
        background-color: inherit;
        display: none;
        outline: none;
        width: min(100vw, calc(100vh * 4 / 3));
        height: auto;
        max-width: 100vw;
        max-height: 100vh;
      }

      .spinner {
        height: 50px;
        width: 50px;
        margin: 0px auto;
        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border-left: 10px solid rgb(64,64,128);
        border-right: 10px solid rgb(64,64,128);
        border-bottom: 10px solid rgb(64,64,128);
        border-top: 10px solid rgb(192,192,192);
        border-radius: 100%;
        background-color: inherit;
      }
      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

    </style>
  </head>
  <body>
    <figure style="overflow:visible;" id="spinner"><div class="spinner"></div><center style="margin-top:0.5em"><strong>S4NDMoD26</strong></center></figure>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>
    </div>
    <textarea class="emscripten" id="output" readonly></textarea>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    <a id="exportFile" hidden=1></a>

    <script type='text/javascript'>
      // Emscripten's UDP-over-WebSocket emulation only creates a fresh
      // connection when the previous one's readyState is CLOSING/CLOSED -
      // if a handshake stalls in CONNECTING (e.g. a mobile network blip)
      // without ever erroring out, every send just silently queues onto
      // the dead socket forever and the client never reconnects. Wrap
      // WebSocket construction so a stuck-CONNECTING socket gets force-
      // closed after a timeout, which lets Emscripten's own reconnect
      // logic kick in on the next send.
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        var STALL_TIMEOUT_MS = 5000;

        function WatchdogWebSocket(url, protocols) {
          var ws = (protocols !== undefined)
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);

          var timer = setTimeout(function() {
            if (ws.readyState === NativeWebSocket.CONNECTING) {
              console.warn('WebSocket stuck CONNECTING for', STALL_TIMEOUT_MS, 'ms, forcing close to allow reconnect:', url);
              try { ws.close(); } catch (e) {}
            }
          }, STALL_TIMEOUT_MS);

          var clearWatchdog = function() { clearTimeout(timer); };
          ws.addEventListener('open', clearWatchdog);
          ws.addEventListener('close', clearWatchdog);
          ws.addEventListener('error', clearWatchdog);

          return ws;
        }

        WatchdogWebSocket.prototype = NativeWebSocket.prototype;
        WatchdogWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        WatchdogWebSocket.OPEN = NativeWebSocket.OPEN;
        WatchdogWebSocket.CLOSING = NativeWebSocket.CLOSING;
        WatchdogWebSocket.CLOSED = NativeWebSocket.CLOSED;

        window.WebSocket = WatchdogWebSocket;
      })();

      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      var exportElement = document.getElementById('exportFile');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // Pop up an alert when webgl context is lost
      canvasElement.addEventListener("webglcontextlost", (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      // Chromium won't let a page suppress reserved shortcuts (Ctrl+W and
      // friends) via keydown preventDefault, but it will via the Keyboard
      // Lock API while in fullscreen - request lock as soon as we enter
      // fullscreen (Escape always remains available to exit, per spec).
      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement && navigator.keyboard && navigator.keyboard.lock) {
          navigator.keyboard.lock().catch((e) => console.warn('Keyboard Lock failed:', e));
        }
      });

      // Firefox/Safari (no Keyboard Lock) and Chrome sessions not in
      // fullscreen fall back to the browser's native "leave site?" prompt
      // while a game is actively in progress.
      window.addEventListener('beforeunload', (e) => {
        if (Module._connected) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      var _urlParams = new URLSearchParams(window.location.search);
      var Module = {
        _canLockPointer: true,
        _connected: false,
        _debug: _urlParams.has('debug') && _urlParams.get('debug') !== '0',
        setConnected(connected) {
          Module._connected = !!connected;
        },
        websocket: {
          // Route all browser sockets through the public WebSocket endpoint
          // instead of deriving ws://host:port from the game server address.
          url: (() => {
            if (window.location.protocol === 'https:') {
              return 'wss://' + window.location.host + '/ws';
            }
            return 'ws://' + window.location.hostname + ':27960';
          })()
        },
        print(...args) {
          console.log(...args);
          if (outputElement) {
            var text = args.join(' ');
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus(text) {
          Module.setStatus.last ??= { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        hideConsole() {
          Module._consoleVisible = false;
          spinnerElement.style.display = 'none';
          statusElement.style.display = 'none';
          progressElement.style.display = 'none';
          outputElement.style.display = 'none';
          canvasElement.style.display = 'block';
          canvasElement.focus();
        },
        showConsole() {
          Module._consoleVisible = true;
          canvasElement.style.display = 'none';
          outputElement.style.display = 'block';
          outputElement.scrollTop = outputElement.scrollHeight;
          outputElement.focus();
        },
        exportFile(filePath) {
          try {
            if (Module._debug) console.info('Exporting:', filePath);
            const filePathSplit = filePath.split('/');
            const dataArray = new Uint8Array(FS.readFile(filePath));
            const dataBlob = new Blob([dataArray], {type: 'application/octet-stream'});
            const objURL = URL.createObjectURL(dataBlob);
            exportElement.href = objURL;
            exportElement.download = filePathSplit[filePathSplit.length - 1];
            exportElement.click();
            URL.revokeObjectURL(objURL);
          } catch (error) {
            console.error('Error exporting file:', error);
          }
        },
        winResized() {
          if (Module._debug) console.info('Detected window resize: ' + canvasElement.width + 'x' + canvasElement.height);
        },
        captureMouse() {
          if (Module._canLockPointer && !Module._attemptPointerLock()) {
            Module._canLockPointer = false;
            if (Module._debug) console.info('Delayed pointer lock requested.');
            document.addEventListener('keydown', Module._lockPointerOnKey);
          }
        },
        _attemptPointerLock() {
          if (document.pointerLockElement === null) {
            const p = canvasElement.requestPointerLock();
            if (p && p.catch) p.catch(() => {});
          }
          // Also request fullscreen, which lets us request Keyboard Lock
          // (see fullscreenchange listener below) so Chromium browsers stop
          // treating combos like Ctrl+W as "close tab" while playing.
          if (!document.fullscreenElement && canvasElement.requestFullscreen) {
            const fs = canvasElement.requestFullscreen();
            if (fs && fs.catch) fs.catch(() => {});
          }
          return document.pointerLockElement !== null;
        },
        _lockPointerOnKey(event) {
          if ((event.key === 'Escape') || Module._attemptPointerLock()) {
            document.removeEventListener('keydown', Module._lockPointerOnKey);
            if (Module._debug) console.info('Delayed pointer lock complete.');
            Module._canLockPointer = true;
          }
        },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        },
        onRuntimeInitialized() {
          if (Module._consoleVisible) {
            outputElement.style.display = 'block';
            canvasElement.style.display = 'none';
          } else {
            outputElement.style.display = 'none';
            canvasElement.style.display = 'block';
          }
        },
        arguments: (window.location.search.length > 1
          ? window.location.search.substr(1).split('&').filter((t) => !/^debug(=|$)/.test(t))
          : []).concat(['+seta', 'cg_viewsize', '100'])
      };
      Module._consoleVisible = true;
      Module.setStatus('Downloading...');
      window.onerror = () => {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>

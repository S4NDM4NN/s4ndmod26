events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types {
        text/plain        sh ps1;
    }
    sendfile      on;

    # The games list and per-game analyses are large, repetitive JSON.
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      application/json;

    server {
        listen 80;

        location ~* ^/downloads/.+\.cfg$ {
            deny all;
            return 403;
        }

        # Versioned pk3s never change content, so browsers and the HTTP cache may keep them.
        location ~ ^/downloads/s4ndmod26/s4ndmod26_[^/]+\.pk3$ {
            root /usr/share/nginx/html;
            add_header Content-Disposition "attachment";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Names the current s4ndmod26_<version>.pk3; must never be served stale.
        location = /downloads/s4ndmod26/latest.txt {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
        }

        location /downloads/ {
            root /usr/share/nginx/html;
            add_header Content-Disposition "attachment";
            expires 1d;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            add_header Cache-Control "no-store";
        }

        # Client-demo uploads (side project).  Raw demo files, one per request; the status API rate-limits by
        # X-Real-IP, which nginx sets from the peer address (a client-sent value is overwritten).
        location /api/userdemos {
            client_max_body_size 40m;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            add_header Cache-Control "no-store";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }

        # The demo pages are unlisted: nothing links to them, and they ask not to be indexed.
        location /demos/ {
            root /usr/share/nginx/html;
            index index.html;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-store" always;
        }

        # WASM browser client — requires SharedArrayBuffer (PROXY_POSIX_SOCKETS)
        location /play/ {
            root /usr/share/nginx/html;
            add_header Cross-Origin-Opener-Policy  "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            expires off;
            add_header Cache-Control "no-store" always;
        }

        # Pages that can open the replay player in a modal iframe.  /play/ is cross-origin
        # isolated (SharedArrayBuffer), and a browser only isolates an iframe whose embedder is
        # isolated too, so these need the same COOP/COEP headers.  Anything they load from another
        # origin must opt in (the Umami script uses crossorigin="anonymous").
        location ~ ^/(game|stats|timeline|replay)\.html$ {
            root /usr/share/nginx/html;
            add_header Cross-Origin-Opener-Policy  "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
        }

        # The stats list used to be games.html.
        location = /games.html {
            return 301 /stats.html$is_args$args;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}

// RadioMaster (or similar RC transmitter used as a USB joystick) overrides
// for /dronesim. exec this AFTER controller.cfg, e.g. in autoexec.cfg:
//   exec controller.cfg
//   exec radiomaster.cfg
//
// Prefer running /dronecal in-game instead of trusting these values as-is -
// it auto-detects the correct axis for each control by watching raw SDL
// axis movement directly, which is the most reliable way to calibrate any
// unusual controller. These are just a known-good starting point from one
// RadioMaster TX15 (VID 1209 / PID 4f54) on the WASM/browser client.
//
// Drone-sim flight control (CL_DroneJoystickMove) and this /dronecal
// readout both read the SDL_GameControllerAxis slot directly
// (IN_GetRawGamepadAxis in code/sdl/sdl_input.c), so these values are
// plain SDL slot indices: 0=LEFTX, 1=LEFTY, 2=RIGHTX, 3=RIGHTY,
// 4=TRIGGERLEFT, 5=TRIGGERRIGHT. No bind changes are needed for drone
// mode - it doesn't go through the normal digital-key/KeyToAxisAndSign
// translation path that regular (non-drone) movement and look use.
seta j_side_axis    "2"
seta j_forward_axis "3"
seta j_yaw_axis     "0"
seta j_pitch_axis   "1"
